[[lesson]]
id = "dp_memo"
topic = "Recursion and dynamic programming"
title = "How does memoization stop repeated work?"
recap = "Memoization saves each answer the first time it is worked out, in a dict. Later calls with the same n return the saved answer at once. fib becomes O(n): each value is computed once. functools.lru_cache does the same thing for you."
dec = "Is n already in memo? Return the saved answer. Otherwise work it out, save it, then return it."
code = '''
memo = {}
calls = 0

def fib(n):
    global calls
    calls += 1
    if n in memo:
        return memo[n]
    if n < 2:
        return n
    memo[n] = fib(n - 1) + fib(n - 2)
    return memo[n]

print(fib(5), calls)
'''
pseudo = [
  "A dict of answers already worked out.",
  "Count every call.",
  "(blank)",
  "Define fib(n):",
  "(use the global counter)",
  "count this call,",
  "if the answer is saved,",
  "return it straight away.",
  "If n is 0 or 1,",
  "that is the answer.",
  "Otherwise work it out once and save it,",
  "then return it.",
  "(blank)",
  "Show fib(5) and how many calls it took.",
]

[lesson.lines.7]
