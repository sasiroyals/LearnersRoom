[[lesson]]
id = "dp_table"
topic = "Recursion and dynamic programming"
title = "How does a table solve the problem from the bottom up?"
recap = "Bottom-up dynamic programming fills a table from the smallest case upward, so every answer it needs is already there. No recursion, no call stack limit. Climbing stairs one or two at a time: ways[i] = ways[i - 1] + ways[i - 2]."
dec = "To reach step i, you came from step i - 1 or step i - 2. Add the ways to reach those."
code = '''
n = 5
ways = [0] * (n + 1)
ways[0] = 1
ways[1] = 1
for i in range(2, n + 1):
    ways[i] = ways[i - 1] + ways[i - 2]
print(ways[n])
'''
pseudo = [
  "A staircase of 5 steps. You climb 1 or 2 steps at a time.",
  "A table with one cell for each step, 0 to 5.",
  "One way to stand at the bottom.",
  "One way to reach step 1.",
  "For each step from 2 up,",
  "add the ways to reach the two steps below it.",
  "Show the ways to reach the top.",
]

[lesson.lines.2]
t = "Make the table"
b = "[0] * 6 makes a list of six zeros. Each cell will hold the number of ways to reach that step."
look = "ways is a list of 6 zeros."

[lesson.lines.6]
t = "Use earlier answers"
b = "The two cells to the left were filled on earlier passes, so the new cell is one addition. Each cell is filled once: O(n)."
look = "One cell of ways fills in."

