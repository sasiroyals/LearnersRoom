[[lesson]]
id = "dp_fib_calls"
topic = "Recursion and dynamic programming"
title = "Why is the plain recursive Fibonacci so slow?"
recap = "fib(n) calls fib(n - 1) and fib(n - 2), and each of those calls two more. The same values are worked out again and again, so the number of calls roughly doubles with each step up in n: O(2ⁿ). fib(30) makes over a million calls."
dec = "Is n below 2? Return it. Otherwise make two more calls and add their answers."
code = '''
calls = 0

def fib(n):
    global calls
    calls += 1
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)

print(fib(4), calls)
'''
pseudo = [
  "Count every call.",
  "(blank)",
  "Define fib(n):",
  "(use the global counter)",
  "count this call,",
  "if n is 0 or 1,",
  "that is the answer.",
  "Otherwise add the two Fibonacci numbers before it.",
  "(blank)",
  "Show fib(4) and how many calls it took.",
]

[lesson.lines.5]
