  "Show it one way.",
  "Show it another way.",
]

[lesson.lines.17]
t = "One job each"
b = "Report does not know how it will be shown. Adding a new format means adding a new printer class, without touching Report. This is the Single Responsibility Principle, the S in SOLID."
look = "The frames: TextPrinter.show calls Report.total."

