[[lesson]]
id = "des_strategy"
topic = "Design"
title = "How does the strategy pattern swap behaviour?"
recap = "The strategy pattern puts each variation of an algorithm behind the same interface and lets the caller choose. In Python a strategy is often just a function. Checkout never changes when you add a new pricing rule."
code = '''
def no_discount(price):
    return price

def sale(price):
    return price * 0.8

class Checkout:
    def __init__(self, pricing):
        self.pricing = pricing

    def pay(self, price):
        return self.pricing(price)

c = Checkout(sale)
print(c.pay(50))
'''
pseudo = [
  "Strategy 1: full price.",
  "(body)",
  "(blank)",
  "Strategy 2: 20% off.",
  "(body)",
  "(blank)",
  "Checkout is given a pricing strategy:",
  "keep it.",
  "(body)",
  "(blank)",
  "Paying asks the strategy.",
  "(body)",
  "(blank)",
  "A checkout using the sale strategy.",
  "Pay 50.",
]

[lesson.lines.12]
