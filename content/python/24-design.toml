topic = "24"

[[lesson]]
id = "des_srp"
topic = "Design"
title = "Why give each class one job?"
recap = "SOLID is five design rules: Single responsibility, Open for extension but closed for modification, Liskov substitution, Interface segregation, Dependency inversion. Here Report has one reason to change (the data), each printer has another (its format), and adding JSON later would not change existing code."
code = '''
class Report:
    def __init__(self, rows):
        self.rows = rows

    def total(self):
        return sum(self.rows)

class TextPrinter:
    def show(self, report):
        return 'Total: ' + str(report.total())

class CsvPrinter:
    def show(self, report):
        return ','.join([str(r) for r in report.rows])

r = Report([3, 4])
print(TextPrinter().show(r))
print(CsvPrinter().show(r))
'''
pseudo = [
  "Report holds data and does maths: one job.",
  "(body)",
  "(body)",
  "(blank)",
  "its calculation,",
  "(body)",
  "(blank)",
  "TextPrinter only formats as text.",
  "(body)",
  "(body)",
  "(blank)",
  "CsvPrinter only formats as CSV.",
  "(body)",
  "(body)",
  "(blank)",
