[[lesson]]
id = "des_factory"
topic = "Design"
title = "What does a factory decide?"
recap = "A factory hides which class gets created. Callers ask for \"sms\" and get something with send. Adding a new channel means one new class and one new dict entry. An unknown name raises KeyError, which a real factory would turn into a clear error message."
code = '''
class Email:
    def send(self, msg):
        return 'email: ' + msg

class Sms:
    def send(self, msg):
        return 'sms: ' + msg

def make_notifier(kind):
    kinds = {'email': Email, 'sms': Sms}
    return kinds[kind]()

n = make_notifier('sms')
print(n.send('hi'))
'''
pseudo = [
  "One kind of notifier.",
  "(body)",
  "(body)",
  "(blank)",
  "Another kind, same send method.",
  "(body)",
  "(body)",
  "(blank)",
  "A factory: given a name, build the right object.",
  "look the class up by name,",
  "create and return one.",
  "(blank)",
  "Ask the factory for an sms notifier.",
  "Use it.",
]

[lesson.lines.10]
t = "Map names to classes"
b = "Classes are objects, so they can sit in a dict like any value."
look = "kinds holds two classes."

[lesson.lines.11]
t = "Build the chosen one"
b = "kinds[kind] picks the class; () creates an instance. The caller never names Email or Sms directly."
look = "A new Sms object."

