[[lesson]]
id = "gen_usedup"
topic = "Iterators and generators"
title = "Why is my generator empty the second time?"
recap = "A generator can be read only once. If you need the values twice, build a list (square brackets) or create a new generator. The trade-off: a list holds everything in memory, a generator holds only one value at a time."
code = '''
squares = (n * n for n in [1, 2, 3])
total = sum(squares)
again = list(squares)
print(total, again)
'''
pseudo = [
  "A generator expression: squares made on demand.",
  "Add them up (this uses every value).",
  "Try to read them again.",
  "Show both.",
]

[lesson.lines.1]
t = "A generator expression"
b = "Round brackets make a generator, not a list. No squares are computed yet."
look = "squares is a generator object."

[lesson.lines.2]
t = "Consume it"
b = "sum pulls every value out of the generator."
look = "total is 14."

[lesson.lines.3]
t = "Nothing left"
b = "A generator runs once. It is now exhausted, so list() gets no values."
look = "again is empty."

[lesson.predict]
line = 3
q = "What will again hold?"
target = { v = "again" }
opts = ["[]", "[1, 4, 9]", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
