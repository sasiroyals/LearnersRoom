[[lesson]]
id = "gen_yield"
topic = "Iterators and generators"
title = "How does a generator pause at yield?"
recap = "Calling countdown(3) did not run its body; it made a generator. Each loop step resumed the body until the next yield. When the body finished (after liftoff), the generator raised StopIteration and the for loop ended. Values are produced one at a time, never stored as a full list."
code = '''
def countdown(n):
    while n > 0:
        yield n
        n = n - 1
    print('liftoff')

for x in countdown(3):
    print(x)
'''
pseudo = [
  "Define countdown: a generator because it contains yield.",
  "while n is above 0:",
  "hand n out and pause here,",
  "when resumed, decrease n.",
  "after the loop, print liftoff.",
  "(blank)",
  "Take values from countdown(3) one at a time,",
  "and print each.",
]

[lesson.lines.3]
t = "yield pauses"
b = "yield hands a value to the for loop and freezes the generator right here, with n remembered."
look = "The countdown frame stays alive between values."

[lesson.lines.4]
t = "Resume"
b = "The for loop asks for the next value, so the generator continues from just after yield."
look = "n decreases."

[lesson.lines.8]
t = "Use the value"
b = "The loop body runs with the value that was yielded."
look = "The output box."

[lesson.predict]
line = 8
q = "What does the first print(x) show?"
target = { out = true, first = true }
opts = ["3", "1", "None"]

[lesson.predict.fb]  # feedback for specific wrong answers
1 = "Not quite. The first value yielded is n itself, 3."

[[lesson.variants]]
label = "countdown(3)"

[lesson.check]  # the final unfamiliar-input question
