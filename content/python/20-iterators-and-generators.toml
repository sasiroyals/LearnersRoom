topic = "20"

[[lesson]]
id = "gen_iter"
topic = "Iterators and generators"
title = "What do iter and next do?"
recap = "for x in items is really: it = iter(items), then call next(it) until StopIteration. An iterator moves only forward and cannot be restarted; ask the list for a fresh iterator to go again."
code = '''
letters = ['a', 'b']
it = iter(letters)
first = next(it)
second = next(it)
third = next(it)
'''
pseudo = [
  "A list of two letters.",
  "Ask the list for an iterator: a bookmark that walks it.",
  "Take the next item.",
  "Take the next item.",
  "Take the next item.",
]

[lesson.lines.2]
t = "An iterator"
b = "iter() returns an object that remembers how far it has got. A for loop does exactly this behind the scenes."
look = "it is a new object."

[lesson.lines.3]
t = "next"
b = "next() returns the current item and moves the bookmark on."
look = "first holds 'a'."

[lesson.lines.5]
t = "Run out"
b = "With no items left, next raises StopIteration. A for loop catches this and simply ends."
look = "Watch for an error."

[lesson.predict]
line = 5
q = "What happens on third = next(it)?"
target = { v = "third" }
opts = ["An error", "'a'", "None"]

[lesson.predict.fb]  # feedback for specific wrong answers
"'a'" = "Not quite. An iterator does not start over. It is used up."
None = "Not quite. next raises StopIteration instead of returning None."

