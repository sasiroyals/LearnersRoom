[[lesson]]
id = "gen_pipeline"
topic = "Iterators and generators"
title = "How do generators chain into a pipeline?"
recap = "Generator stages pass one item at a time: read strips a line, hands it to non_empty, which keeps or drops it, then the next line starts. This works on huge inputs because no stage builds a full list."
code = '''
def read(lines):
    for line in lines:
        yield line.strip()

def non_empty(items):
    for s in items:
        if s:
            yield s

raw = [' a ', '', ' b']
clean = list(non_empty(read(raw)))
print(clean)
'''
pseudo = [
  "Stage 1: strip each line,",
  "(body)",
  "(body)",
  "(blank)",
  "Stage 2: drop empty strings,",
  "(body)",
  "(body)",
  "(body)",
  "(blank)",
  "Raw input.",
  "Connect the stages and collect the results.",
  "Show them.",
]

[lesson.lines.11]
t = "Connect the stages"
b = "read(raw) and non_empty(...) are generators. Nothing runs until list() asks for values. Then each value flows through both stages, one at a time."
look = "Frames for read and non_empty take turns."

[lesson.predict]
line = 11
q = "What will clean hold?"
target = { v = "clean" }
opts = ["['a', 'b']", "[' a ', ' b']", "['a', '', 'b']"]

[lesson.predict.fb]  # feedback for specific wrong answers
