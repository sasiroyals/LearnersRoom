[[lesson]]
id = "cls_self"
topic = "Classes and objects"
title = "How does a method know which object to change?"
recap = "Every call c.tick() passed the object before the dot in as self. So tick changed c1’s count twice and c2’s count once. self is how one method works for every object."
code = '''
class Counter:
    def __init__(self):
        self.count = 0

    def tick(self):
        self.count = self.count + 1

c1 = Counter()
c2 = Counter()
c1.tick()
c1.tick()
c2.tick()
print(c1.count, c2.count)
'''
pseudo = [
  "Define Counter.",
  "When built, start count at 0.",
  "(start at 0)",
  "(blank)",
  "tick adds 1 to this object’s count.",
  "(add 1)",
  "(blank)",
  "Build c1.",
  "Build c2.",
  "Tick c1.",
  "Tick c1 again.",
  "Tick c2.",
  "Show both counts.",
]

[lesson.lines.6]
t = "Change through self"
b = "self.count changes the object that self refers to, and no other."
look = "Only one object’s count changes."

[lesson.lines.10]
t = "Call a method"
b = "c1.tick() is the same as Counter.tick(c1). Python passes the object before the dot as self."
look = "self in the tick() frame points to the object c1 points to."

[lesson.lines.12]
t = "Tick the other object"
b = "This time self is c2’s object."
look = "Follow the self arrow."

[lesson.predict]
line = 13
q = "What will print(c1.count, c2.count) show?"
target = { out = true }
opts = ["2 1", "3 3", "1 1"]

[lesson.predict.fb]  # feedback for specific wrong answers
"3 3" = "Not quite. Each object has its own count. c1 was ticked twice and c2 once."
"1 1" = "Not quite. c1.tick() ran twice, so c1’s count reached 2."

[[lesson.variants]]
label = "tick c1 twice"

