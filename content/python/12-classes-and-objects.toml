[[lesson]]
id = "cls_state"
topic = "Classes and objects"
title = "How does a method keep track of a balance?"
recap = "The object stored balance as state. Each deposit call read it through self, added to it and saved it back. The second call started from 70, not 50."
code = '''
class Account:
    def __init__(self, balance):
        self.balance = balance

    def deposit(self, amount):
        self.balance = self.balance + amount
        return self.balance

acct = Account(50)
acct.deposit(20)
total = acct.deposit(5)
print(total)
'''
pseudo = [
  "Define Account.",
  "When built, store the starting balance.",
  "(store)",
  "(blank)",
  "deposit adds an amount to this account.",
  "(add)",
  "Give back the new balance.",
  "(blank)",
  "Open an account with 50.",
  "Deposit 20.",
  "Deposit 5 and keep the returned balance.",
  "Show it.",
]

[lesson.lines.6]
t = "Update the state"
b = "The object remembers its balance between calls. That stored data is its state."
look = "The balance row changes in the object box."

[lesson.lines.10]
t = "Call deposit"
b = "self is acct’s object and amount is the argument."
look = "The deposit() frame."

[lesson.predict]
line = 11
q = "What will total hold?"
target = { v = "total" }
opts = ["75", "25", "70"]

[lesson.predict.fb]  # feedback for specific wrong answers
25 = "Not quite. The object kept the balance from the first deposit."
70 = "Not quite. 70 was the balance after the first deposit. Then 5 more was added."

