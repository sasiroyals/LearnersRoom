[[lesson]]
id = "cls_attr"
topic = "Classes and objects"
title = "Why did one change reach every object?"
recap = "p.team looked on p first, found nothing, then found the class value Blue. q.team found q’s own attribute Green first. Attribute lookup checks the object, then its class."
dec = "Looking up obj.attr asks: does the object have it? If yes, use it. If not, does its class have it? If not, its parent class? Otherwise an AttributeError."
code = '''
class Player:
    team = 'Red'

    def __init__(self, name):
        self.name = name

p = Player('Ana')
q = Player('Ben')
Player.team = 'Blue'
q.team = 'Green'
print(p.team, q.team)
'''
pseudo = [
  "Define Player.",
  "A class attribute team, shared by all players.",
  "(blank)",
  "When built, store this player’s name.",
  "(store)",
  "(blank)",
  "Build Ana.",
  "Build Ben.",
  "Change the shared team on the class.",
  "Give q its own team attribute.",
  "Show both teams.",
]

[lesson.lines.1]
t = "A class attribute"
b = "team belongs to the class, so every Player shares it."
look = "team sits in the class box, not in an object."

[lesson.lines.9]
t = "Change the class attribute"
b = "Changing Player.team changes the one shared value. Every object that does not have its own team sees it."
look = "The team row in the class box."

[lesson.lines.10]
t = "Shadow it on one object"
b = "q.team = ... creates a new attribute on q only. It hides the class value for q."
look = "q’s object box gains its own team row."

[lesson.predict]
line = 11
q = "What will print(p.team, q.team) show?"
target = { out = true }
opts = ["Blue Green", "Red Green", "Blue Blue"]

[lesson.predict.fb]  # feedback for specific wrong answers
"Red Green" = "Not quite. Player.team was changed to Blue, and p has no team of its own, so p sees Blue."
"Blue Blue" = "Not quite. q.team = 'Green' gave q its own attribute, which wins over the class value."

[[lesson.variants]]
label = "shared team"

