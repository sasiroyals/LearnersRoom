[[lesson]]
id = "cls_repr"
topic = "Classes and objects"
title = "Why does print show <__main__.Plain object>?"
recap = "print asked each object for its text form. Plain had none, so Python showed a generic <__main__.Plain object>. Nice defined __repr__, and Python called it to get Nice(3). Defining __repr__ makes your objects readable in output and while debugging."
code = '''
class Plain:
    def __init__(self, x):
        self.x = x

class Nice:
    def __init__(self, x):
        self.x = x

    def __repr__(self):
        return 'Nice(' + str(self.x) + ')'

print(Plain(3))
print(Nice(3))
'''
pseudo = [
  "Define Plain, with no text form of its own.",
  "(init)",
  "(store x)",
  "(blank)",
  "Define Nice.",
  "(init)",
  "(store x)",
  "(blank)",
  "Nice’s text form is Nice(x).",
  "(build the text)",
  "(blank)",
  "Print a Plain object.",
  "Print a Nice object.",
]

[lesson.lines.12]
t = "Print a plain object"
b = "Plain defines no text form, so Python falls back to a generic one with the class name."
look = "The output box."

[lesson.lines.13]
t = "Print a Nice object"
b = "print asks the object for its text form. Nice defines __repr__, so Python calls it."
look = "A __repr__ frame appears."

[lesson.predict]
line = 13
q = "What will print(Nice(3)) show?"
target = { out = true }
opts = ["Nice(3)", "<__main__.Nice object>", "3"]

[lesson.predict.fb]  # feedback for specific wrong answers
3 = "Not quite. print shows the object’s text form, which __repr__ builds as Nice(3)."
"<__main__.Nice object>" = "Not quite. Nice defines __repr__, so print uses it."

[[lesson.variants]]
label = "with __repr__"

