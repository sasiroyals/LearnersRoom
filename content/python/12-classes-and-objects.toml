topic = "12"

[[lesson]]
id = "cls_blueprint"
topic = "Classes and objects"
title = "What is the difference between a class and an object?"
recap = "One class, Dog, built two separate objects. Each object stored its own name through self. A class is the blueprint, and an object is one thing built from it."
code = '''
class Dog:
    def __init__(self, name):
        self.name = name

a = Dog('Rex')
b = Dog('Bo')
print(a.name, b.name)
'''
pseudo = [
  "Define the class Dog: the blueprint.",
  "When a Dog is built, store its name on it.",
  "(store the name)",
  "(blank)",
  "Build a Dog named Rex. Call it a.",
  "Build a Dog named Bo. Call it b.",
  "Show both names.",
]

[lesson.lines.1]
t = "Define the class"
b = "class creates a blueprint. No dog exists yet."
look = "The class box on the right lists the methods."

[lesson.lines.3]
t = "Store data on the object"
b = "self.name = name puts an attribute on this object only."
look = "The object box gains a name row."

[lesson.lines.5]
t = "Build an object"
b = "Dog('Rex') makes a new, empty object and runs __init__ on it. self is that new object."
look = "self in the __init__ frame points to the new object."

[lesson.lines.6]
t = "Build a second object"
b = "The same blueprint builds another, separate object with its own name."
look = "Two object boxes, both pointing to the one class."

[lesson.predict]
line = 7
q = "What will print(a.name, b.name) show?"
target = { out = true }
opts = ["Rex Bo", "Bo Bo", "Rex Rex"]

[lesson.predict.fb]  # feedback for specific wrong answers
"Bo Bo" = "Not quite. Each object keeps its own name. Building b did not change a."
"Rex Rex" = "Not quite. b was built with Bo, and it is a separate object."

[[lesson.variants]]
label = "two dogs"

