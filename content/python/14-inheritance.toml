[[lesson]]
id = "inh_override"
topic = "Inheritance"
title = "Which version of a method runs?"
recap = "Both objects ran the same speak method from Animal. Inside it, self.sound() was looked up on the actual object: the Duck’s own sound gave quack, and the plain Animal’s gave .... Overriding means the subclass’s version wins, even when the parent’s code makes the call."
dec = "For self.sound(), Python asks: does the object’s own class define sound? Duck: yes, use it. Animal object: use Animal.sound."
code = '''
class Animal:
    def sound(self):
        return '...'

    def speak(self):
        return 'It says ' + self.sound()

class Duck(Animal):
    def sound(self):
        return 'quack'

d = Duck()
a = Animal()
print(d.speak())
print(a.speak())
'''
pseudo = [
  "Define Animal.",
  "sound gives back ...",
  "(return)",
  "(blank)",
  "speak builds a sentence using self.sound().",
  "(build)",
  "(blank)",
  "Define Duck as an Animal.",
  "Duck replaces sound with its own version.",
  "(return quack)",
  "(blank)",
  "Build a Duck.",
  "Build a plain Animal.",
  "Make the duck speak.",
  "Make the animal speak.",
]

[lesson.lines.6]
t = "self.sound() inside the parent"
b = "Python looks up sound on self, which is a Duck. Duck has its own sound, so that one wins."
look = "The next frame is Duck.sound."

[lesson.lines.14]
t = "Call an inherited method"
b = "Duck has no speak, so Animal.speak runs, with self = the duck."
look = "The Animal.speak frame, and what self points to."

[lesson.lines.15]
t = "Same code, different object"
b = "This time self is a plain Animal, so Animal.sound runs."
look = "Compare the sound frame with the duck’s."

[lesson.predict]
line = 14
q = "What will print(d.speak()) show?"
target = { out = true }
opts = ["It says quack", "It says ...", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
"It says ..." = "Not quite. speak is Animal’s code, but it calls self.sound(), and self is a Duck. Duck’s sound overrides the parent’s."
"An error" = "No error. Duck inherits speak from Animal."

