[lesson.check]  # the final unfamiliar-input question
code = '''
class A:
    def __init__(self):
        self.x = 1

class B(A):
    def __init__(self):
        self.y = 2

print(B().x)'''
q = "What happens?"
opts = ["It prints 1", "An AttributeError"]
right = 1
fb = [
  "Not quite. B.__init__ replaced A.__init__ and never called super(), so x was never set.",
