[[lesson]]
id = "inh_super"
topic = "Inheritance"
title = "Why call super().__init__?"
recap = "Bike’s own __init__ replaced Vehicle’s. Calling super().__init__(2) let Vehicle set wheels on the same object before Bike added color. Without that call, wheels is never set, and reading it fails with an AttributeError."
code = '''
class Vehicle:
    def __init__(self, wheels):
        self.wheels = wheels

class Bike(Vehicle):
    def __init__(self, color):
        super().__init__(2)
        self.color = color

b = Bike('red')
print(b.wheels, b.color)
'''
pseudo = [
  "Define Vehicle.",
  "When built, store the number of wheels.",
  "(store)",
  "(blank)",
  "Define Bike as a Vehicle.",
  "Bike has its own __init__:",
  "first let Vehicle set up its part, with 2 wheels,",
  "then store the color.",
  "(blank)",
  "Build a red Bike.",
  "Show wheels and color.",
]

[lesson.lines.3]
t = "Parent sets its part"
b = "Vehicle stores wheels on the Bike object."
look = "wheels appears on the object."

[lesson.lines.7]
t = "Hand over to the parent"
b = "super().__init__(2) runs Vehicle.__init__ on the same object, so the parent can set up its attributes."
look = "A Vehicle.__init__ frame appears with the same self."

[lesson.lines.8]
t = "Child sets its part"
b = "Back in Bike.__init__, color is added."
look = "color appears on the object."

[lesson.lines.10]
t = "Build a Bike"
b = "Bike defines its own __init__, so Python runs Bike.__init__, not Vehicle’s."
look = "The Bike.__init__ frame."

[lesson.predict]
line = 11
q = "What will print(b.wheels, b.color) show?"
target = { out = true }
opts = ["2 red", "An error", "red"]

[lesson.predict.fb]  # feedback for specific wrong answers
"An error" = "Not quite with this code. super().__init__(2) set wheels. Try the \"without super()\" input to see the error."
red = "Not quite. print shows both values."

