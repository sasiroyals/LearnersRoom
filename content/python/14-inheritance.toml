# Python 14: Inheritance
# One [[lesson]] block per lesson, in the order students see them.
# Line numbers in lines, predict.line and pline count from 1.

topic = "14"

[[lesson]]
id = "inh_reuse"
topic = "Inheritance"
title = "How does a subclass reuse its parent’s code?"
recap = "Cat defined nothing, but a Cat object could still be built and described. For each missing method, Python looked in Cat first, then in its parent Animal. Inheritance lets a subclass reuse everything its parent already does."
code = '''
class Animal:
    def __init__(self, name):
        self.name = name

    def describe(self):
        return self.name + ' is an animal'

class Cat(Animal):
    pass

c = Cat('Tom')
print(c.describe())
'''
pseudo = [
  "Define Animal.",
  "When built, store the name.",
  "(store)",
  "(blank)",
  "describe gives back a sentence.",
  "(build it)",
  "(blank)",
  "Define Cat as a kind of Animal, with nothing new.",
  "(empty body)",
  "(blank)",
  "Build a Cat named Tom.",
  "Show its description.",
]

[lesson.lines.8]
t = "Define a subclass"
b = "class Cat(Animal) says: a Cat is an Animal. Cat defines nothing of its own."
look = "The dashed \"inherits from\" arrow from Cat to Animal."

[lesson.lines.11]
t = "Build a Cat"
b = "Cat has no __init__, so Python looks in its parent and runs Animal.__init__."
look = "The frame name says Animal.__init__."

[lesson.lines.12]
t = "Call an inherited method"
b = "Cat has no describe either. Python climbs to Animal and finds it there."
look = "The describe frame belongs to Animal."

[lesson.predict]
line = 12
q = "What will print(c.describe()) show?"
target = { out = true }
opts = ["Tom is an animal", "An error", "Cat"]

[lesson.predict.fb]  # feedback for specific wrong answers
"An error" = "Not quite. Cat inherits describe from Animal, so the call works."
Cat = "Not quite. describe builds a sentence from the name."

[[lesson.variants]]
label = "Cat(Animal)"

