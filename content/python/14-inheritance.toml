]

[[lesson]]
id = "inh_isinstance"
topic = "Inheritance"
title = "Is a Bike also a Vehicle?"
recap = "A Bike object counts as a Vehicle, because isinstance checks the whole chain of parents. A plain Vehicle is not a Bike. issubclass asks the same question about classes instead of objects."
code = '''
class Vehicle:
    pass

class Bike(Vehicle):
    pass

b = Bike()
v = Vehicle()
r1 = isinstance(b, Vehicle)
r2 = isinstance(v, Bike)
r3 = issubclass(Bike, Vehicle)
print(r1, r2, r3)
'''
pseudo = [
  "Define Vehicle.",
  "(empty)",
  "(blank)",
  "Define Bike as a Vehicle.",
  "(empty)",
  "(blank)",
  "Build a Bike.",
  "Build a Vehicle.",
  "Is the bike a Vehicle?",
  "Is the vehicle a Bike?",
  "Is Bike a subclass of Vehicle?",
  "Show the three answers.",
]

[lesson.lines.9]
t = "isinstance follows the chain"
b = "isinstance(b, Vehicle) checks the object’s class and every parent of it."
look = "The \"inherits from\" arrow from Bike to Vehicle."

[lesson.lines.10]
t = "The chain goes one way"
b = "A Vehicle object is not a Bike. Parents do not inherit from children."
look = "There is no arrow from Vehicle to Bike."

[lesson.predict]
line = 10
q = "What will r2 = isinstance(v, Bike) hold?"
target = { v = "r2" }
opts = ["True", "False"]

[lesson.predict.fb]  # feedback for specific wrong answers
True = "Not quite. Every Bike is a Vehicle, but not every Vehicle is a Bike."

[[lesson.variants]]
label = "v is a Vehicle"

