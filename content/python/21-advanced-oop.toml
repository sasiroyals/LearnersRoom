[[lesson]]
id = "adv_descriptor"
topic = "Advanced OOP"
title = "How does @property actually work?"
recap = "A descriptor is an object on a class with __get__ and/or __set__. Attribute access on instances is routed through it. @property is a ready-made descriptor; writing your own lets you reuse one validation rule across many attributes and classes."
code = '''
class Positive:
    def __init__(self, key):
        self.key = key

    def __get__(self, obj, objtype=None):
        return getattr(obj, self.key)

    def __set__(self, obj, value):
        if value <= 0:
            raise ValueError('must be positive')
        setattr(obj, self.key, value)

class Box:
    width = Positive('_width')

b = Box()
b.width = 5
b.width = -1
'''
pseudo = [
  "A descriptor class:",
  "when created, remember where to store the real value,",
  "(body)",
  "(blank)",
  "reading the attribute calls __get__,",
  "(body)",
  "(blank)",
  "writing it calls __set__,",
  "which checks the value,",
  "(body)",
  "then stores it.",
  "(blank)",
  "Box uses it for width:",
  "(body)",
  "(blank)",
  "Build a box.",
  "Set a good width.",
  "Set a bad width.",
]

[lesson.lines.17]
t = "Assignment calls __set__"
b = "width is a descriptor object stored on the class. b.width = 5 does not simply store 5; Python calls Positive.__set__(descriptor, b, 5)."
look = "A __set__ frame appears."

[lesson.lines.18]
t = "Validation"
b = "The same check runs on every assignment, for every Box."
look = "Watch for an error."

[lesson.predict]
