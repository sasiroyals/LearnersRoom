[[lesson]]
id = "adv_classmethod"
topic = "Advanced OOP"
title = "When do I use @classmethod and @staticmethod?"
recap = "Use @classmethod when the method needs the class, usually to build objects in another way (from_f). Use @staticmethod for a helper that needs neither the object nor the class. Plain methods get self, the object."
code = '''
class Temp:
    def __init__(self, c):
        self.c = c

    @classmethod
    def from_f(cls, f):
        return cls((f - 32) * 5 / 9)

    @staticmethod
    def is_valid(c):
        return c >= -273

t = Temp.from_f(212)
ok = Temp.is_valid(t.c)
print(t.c, ok)
'''
pseudo = [
  "Define Temp.",
  "Build from Celsius:",
  "store it.",
  "(blank)",
  "A class method: gets the class, not an object.",
  "another way to build a Temp, from Fahrenheit.",
  "(body)",
  "(blank)",
  "A static method: gets neither.",
  "a plain helper that lives in the class.",
  "(body)",
  "(blank)",
  "Build a Temp from 212 °F.",
  "Check it.",
  "Show both.",
]

[lesson.lines.13]
t = "Call on the class"
b = "Temp.from_f(212) passes the class itself as cls. from_f then calls cls(...) to build a new object. This is an alternative constructor."
look = "A from_f frame with cls."

[lesson.lines.14]
t = "A static method"
b = "is_valid receives no self and no cls. It is an ordinary function kept in the class because it belongs with it."
look = "An is_valid frame with only c."

[lesson.predict]
line = 15
q = "What will print(t.c, ok) show?"
target = { out = true }
opts = ["100.0 True", "212 True", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
"212 True" = "Not quite. from_f converts: (212 - 32) * 5 / 9 is 100.0."

[[lesson.variants]]
label = "212 °F"

