[[lesson]]
id = "adv_dataclass"
topic = "Advanced OOP"
title = "What does @dataclass write for me?"
recap = "@dataclass turns a list of typed fields into a full class: constructor, readable repr, and field-by-field equality. Fields without a default are required, so Item() fails. Add frozen=True to make the objects read-only."
code = '''
from dataclasses import dataclass

@dataclass
class Item:
    name: str
    price: float = 1.0

a = Item('pen')
b = Item('pen', 1.0)
print(a, a == b)
'''
pseudo = [
  "Load dataclass.",
  "(blank)",
  "Generate the boring methods for the class below.",
  "class Item, listing its fields:",
  "Item has a name,",
  "and a price, 1.0 by default.",
  "(blank)",
  "Build one with the default price.",
  "Build another, same values.",
  "Show one and compare.",
]

[lesson.lines.3]
t = "A class generator"
b = "@dataclass reads the fields listed in the class and writes __init__, __repr__ and __eq__ for you."
look = "The Item class is created."

[lesson.lines.10]
t = "Value equality"
b = "The generated __eq__ compares the fields, so two items with the same values are equal."
look = "The output box."

