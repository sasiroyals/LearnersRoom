[[lesson]]
id = "adv_mro"
topic = "Advanced OOP"
title = "Which parent wins in multiple inheritance?"
recap = "With several parents, Python builds one ordered list (Child.__mro__) and every super() call moves one step along it. That is how each class gets called exactly once. Change the order of parents and the order of calls changes too."
code = '''
class Base:
    def hello(self):
        return 'Base'

class Left(Base):
    def hello(self):
        return 'Left>' + super().hello()

class Right(Base):
    def hello(self):
        return 'Right>' + super().hello()

class Child(Left, Right):
    pass

print(Child().hello())
'''
pseudo = [
  "Base says Base.",
  "(body)",
  "(body)",
  "(blank)",
  "Left adds its name, then asks super().",
  "(body)",
  "(body)",
  "(blank)",
  "Right adds its name, then asks super().",
  "(body)",
  "(body)",
  "(blank)",
  "Child inherits from Left, then Right.",
  "(body)",
  "(blank)",
  "Ask a Child to say hello.",
]

[lesson.lines.7]
t = "super() means next in line"
b = "super() in Left does not mean Base. It means the next class in the MRO, which for a Child is Right."
look = "The next frame is Right.hello."

[lesson.lines.16]
t = "Method resolution order"
b = "Python lines up the classes in one order, the MRO: Child, Left, Right, Base, object. A method is looked up along that line."
look = "Which hello frame appears first."

[lesson.predict]
line = 16
q = "What will print(Child().hello()) show?"
target = { out = true }
opts = ["Left>Right>Base", "Left>Base", "Right>Left>Base"]

[lesson.predict.fb]  # feedback for specific wrong answers
"Left>Base" = "Not quite. super() follows the MRO of the actual object, Child, so after Left comes Right."

[[lesson.variants]]
label = "(Left, Right)"

[[lesson.variants]]
label = "(Right, Left)"
from = "Child(Left, Right)"
to = "Child(Right, Left)"
opts = ["Right>Left>Base", "Left>Right>Base", "Right>Base"]

[lesson.check]  # the final unfamiliar-input question
code = '''
class A: pass
class B(A): pass
class C(A): pass
class D(B, C): pass
m = [k.__name__ for k in D.__mro__]'''
q = "What is m?"
opts = ["['D', 'B', 'C', 'A', 'object']", "['D', 'B', 'A', 'C', 'object']"]
right = 0
fb = [
  "Right. A shared parent comes after all its children.",
  "Not quite. A comes only after both B and C.",
]

[[lesson]]
id = "adv_mixin"
topic = "Advanced OOP"
title = "What is a mixin?"
recap = "A mixin is a small class that adds one focused ability and is meant to be combined with other classes. It does not stand alone and does not represent an \"is a\" relationship; it is a reusable add-on."
code = '''
class ReprMixin:
    def __repr__(self):
        pairs = [k + '=' + repr(v) for k, v in self.__dict__.items()]
        return type(self).__name__ + '(' + ', '.join(pairs) + ')'

class Point(ReprMixin):
    def __init__(self, x, y):
        self.x = x
        self.y = y

print(Point(1, 2))
'''
pseudo = [
  "A small class that only adds one ability:",
  "a readable text form,",
  "built from the object’s attributes,",
  "with the real class name.",
  "(blank)",
  "Point gets that ability by inheriting it.",
  "Build a point:",
  "(body)",
  "(body)",
  "(blank)",
  "Show a point.",
]

[lesson.lines.11]
t = "Borrowed behaviour"
b = "Point does not define __repr__. Python finds it in ReprMixin. Inside it, self is the Point, so self.__dict__ holds x and y."
look = "The __repr__ frame belongs to ReprMixin."

[lesson.predict]
line = 11
q = "What will print(Point(1, 2)) show?"
target = { out = true }
opts = ["Point(x=1, y=2)", "ReprMixin(x=1, y=2)", "<__main__.Point object>"]

[lesson.predict.fb]  # feedback for specific wrong answers
"ReprMixin(x=1, y=2)" = "Not quite. type(self) is Point, the object’s real class."

[[lesson.variants]]
