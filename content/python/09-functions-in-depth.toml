# Python 09: Functions in depth
# One [[lesson]] block per lesson, in the order students see them.
# Line numbers in lines, predict.line and pline count from 1.

topic = "09"

[[lesson]]
id = "fd_legb"
topic = "Functions in depth"
title = "Where does Python look up a name?"
recap = "Python looks a name up in four places, in order: Local, Enclosing function, Global, Built-in (LEGB). The first match wins. Remove outer’s x and the search continues out to the global x."
dec = "Looking up x: is it local to inner? No. Is it in outer? Yes: use it. (If not, try global, then built-in.)"
code = '''
x = 'global'

def outer():
    x = 'enclosing'
    def inner():
        return x
    return inner()

r = outer()
print(r, x)
'''
pseudo = [
  "A global x.",
  "(blank)",
  "Define outer:",
  "it has its own x.",
  "Define inner inside it:",
  "inner returns x (it has no x of its own).",
  "outer returns what inner gives.",
  "(blank)",
  "Call outer.",
  "Show r and the global x.",
]

[lesson.lines.4]
t = "An enclosing name"
b = "This x is local to outer. It does not touch the global x."
look = "The outer() frame has its own x."

[lesson.lines.6]
t = "Look up x"
b = "inner has no x. Python searches outward: Local, then Enclosing (outer), then Global, then Built-in. That order is called LEGB. It finds outer’s x first."
look = "The inner() frame has no names at all."

[lesson.lines.10]
t = "The global is untouched"
b = "The global x was never changed."
look = "The output box."

[lesson.predict]
line = 9
q = "What will r hold?"
target = { v = "r" }
opts = ["'enclosing'", "'global'", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
"'global'" = "Not quite. The enclosing function’s x is found before the global one."

[[lesson.variants]]
label = "outer has x"

[[lesson.variants]]
label = "outer has no x"
from = '''
    x = 'enclosing'
'''
to = '''
    pass
'''
opts = ["'global'", "'enclosing'", "An error"]

[lesson.check]  # the final unfamiliar-input question
code = '''
len = 3
n = len('abc')'''
q = "What happens?"
opts = ["An error", "n is 3"]
right = 0
fb = [
  "Right. The global len (an int) hides the built-in len, so calling it fails.",
  "Not quite. The global name len is found before the built-in, and 3 cannot be called.",
]

[[lesson]]
id = "fd_default"
topic = "Functions in depth"
title = "Why does my default list remember old calls?"
recap = "A mutable default (a list or dict) is shared by every call. The fix is bag=None, then make a new list inside the function when bag is None."
code = '''
def add(item, bag=[]):
    bag.append(item)
    return bag

a = add('pen')
b = add('cup')
print(b)
'''
pseudo = [
  "Define add, with a default bag made ONCE, when def runs.",
  "Put the item in the bag.",
  "Return the bag.",
  "(blank)",
  "Call without a bag.",
  "Call again without a bag.",
  "Show b.",
]

[lesson.lines.1]
t = "The default is made once"
b = "Default values are created when def runs, not on each call. Every call that leaves bag out shares that one list."
look = "The function object is created."

[lesson.lines.2]
t = "Change the shared list"
b = "append changes the default list itself."
look = "The list grows."

[lesson.lines.6]
t = "Second call"
b = "bag again refers to the same default list, which already holds pen."
look = "bag points at the same list as a."

[lesson.predict]
line = 7
q = "What will print(b) show?"
target = { out = true }
opts = ["['pen', 'cup']", "['cup']", "['pen']"]

[lesson.predict.fb]  # feedback for specific wrong answers
"['cup']" = "Not quite. Both calls used the same default list, created once."

[[lesson.variants]]
label = "bag=[]"

[[lesson.variants]]
label = "bag=None"
from = '''
def add(item, bag=[]):
    bag.append(item)
'''
to = '''
def add(item, bag=None):
    bag = bag or []; bag.append(item)
'''
opts = ["['cup']", "['pen', 'cup']", "None"]

[lesson.check]  # the final unfamiliar-input question
code = '''
def f(d={}):
    d['n'] = d.get('n', 0) + 1
    return d['n']
f()
x = f()'''
q = "What is x?"
opts = ["2", "1"]
right = 0
fb = [
  "Right. The same dict is reused.",
  "Not quite. The default dict is shared, so n keeps counting.",
]

[[lesson]]
id = "fd_args"
topic = "Functions in depth"
title = "What do *args and **kwargs collect?"
recap = "*args packs extra positional arguments into a tuple; **kwargs packs extra keyword arguments into a dict. The same stars unpack when calling: f(*xs, **opts)."
code = '''
def report(title, *args, **kwargs):
    return title, args, kwargs

r = report('Q1', 5, 9, unit='kg', round=True)
print(r[1], r[2])
'''
pseudo = [
  "Define report: one named parameter, then a catch-all for extra positions and one for extra keywords.",
  "Return all three.",
  "(blank)",
  "Call it with 2 extra values and 2 keywords.",
  "Show what was collected.",
]

[lesson.lines.4]
t = "Collect the extras"
b = "title takes 'Q1'. *args gathers every extra positional value into a tuple. **kwargs gathers every extra keyword into a dict."
look = "The report() frame shows args and kwargs."

[lesson.predict]
line = 5
q = "What will print(r[1], r[2]) show?"
target = { out = true }
opts = [
  "(5, 9) {'unit': 'kg', 'round': True}",
