[[lesson]]
id = "fd_recursion"
topic = "Functions in depth"
title = "How does recursion use the call stack?"
recap = "fact(3) waited on fact(2), which waited on fact(1). The base case returned 1, and the answers multiplied on the way back: 1, 2, 6. Without a reachable base case (try fact(0)), the calls never stop: standard Python raises RecursionError after about 1000 frames, and this site stops it after 600 steps."
dec = "Is n == 1? Yes: return 1. No: call fact(n - 1) and wait, then multiply."
code = '''
def fact(n):
    if n == 1:
        return 1
    return n * fact(n - 1)

x = fact(3)
print(x)
'''
pseudo = [
  "Define fact(n):",
  "if n is 1,",
  "the answer is 1 (the base case).",
  "otherwise n times fact of n - 1.",
  "(blank)",
  "Call fact(3).",
  "Show it.",
]

[lesson.lines.2]
t = "Base case?"
b = "Every recursive function needs a case that stops without calling itself."
look = "The frame stack on the left."

[lesson.lines.3]
t = "Bottom reached"
b = "fact(1) returns 1 directly. Now the waiting frames finish, one by one, in reverse order."
look = "Frames start to disappear."

[lesson.lines.4]
t = "Call itself"
b = "fact(3) cannot finish yet: it needs fact(2) first. A new frame is pushed for every call, each with its own n."
look = "Frames stack up."

[lesson.predict]
line = 6
q = "What will x hold?"
target = { v = "x" }
opts = ["6", "3", "1"]

[lesson.predict.fb]  # feedback for specific wrong answers
1 = "Not quite. 1 is only what the deepest call returns. Each waiting call multiplies it on the way back."

[[lesson.variants]]
label = "fact(3)"

[[lesson.variants]]
label = "fact(0)"
from = "fact(3)"
to = "fact(0)"
opts = ["An error", "0", "1"]

[lesson.check]  # the final unfamiliar-input question
code = '''
def s(n):
    if n == 0:
        return 0
    return n + s(n - 1)
x = s(3)'''
q = "What is x?"
opts = ["6", "3", "0"]
right = 0
fb = [
  "Right. 3 + 2 + 1 + 0.",
  "Not quite. The calls add up on the way back.",
  "Not quite. 0 is only the base case.",
]
