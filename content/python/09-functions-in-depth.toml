[[lesson]]
id = "fd_kwonly"
topic = "Functions in depth"
title = "What does a bare * in the parameters do?"
recap = "Parameters after a bare * are keyword-only. area(2, 3, unit='cm') works; area(2, 3, 'cm') raises TypeError. Use it for options that would be confusing as a bare value."
code = '''
def area(w, h, *, unit='m'):
    return str(w * h) + unit

a = area(2, 3, unit='cm')
b = area(2, 3, 'cm')
'''
pseudo = [
  "Define area: w and h by position; unit only by name.",
  "Return the area with its unit.",
  "(blank)",
  "Call with unit by name.",
  "Try to pass unit by position.",
]

[lesson.lines.1]
t = "Keyword-only"
b = "Every parameter after a bare * must be passed by name. This stops callers mixing up arguments."
look = "The function is defined."

[lesson.lines.5]
t = "Passed by position"
b = "Only w and h can be filled by position. A third positional value has nowhere to go."
look = "Watch for an error."

[lesson.predict]
line = 5
q = "What happens on b = area(2, 3, 'cm')?"
target = { v = "b" }
opts = ["An error", "'6cm'", "'6m'"]

[lesson.predict.fb]  # feedback for specific wrong answers
"'6cm'" = "Not quite. unit comes after *, so it can only be passed as unit=..."

[[lesson.variants]]
label = "with *"

[[lesson.variants]]
label = "without *"
from = "w, h, *, unit"
to = "w, h, unit"
opts = ["'6cm'", "An error", "'6m'"]

[lesson.check]  # the final unfamiliar-input question
code = '''
def f(a, *, b):
    return a + b
x = f(1, b=2)'''
q = "What is x?"
opts = ["3", "An error"]
right = 0
fb = [
  "Right. b is passed by name.",
  "Not quite. Passing b by name is exactly what is required.",
]

[[lesson]]
id = "fd_lambda"
topic = "Functions in depth"
title = "What is a lambda?"
recap = "A lambda is a one-expression function written inline. It is handy for small keys and callbacks. For anything longer, a def with a name is clearer."
code = '''
words = ['kiwi', 'fig', 'banana']
by_len = sorted(words, key=lambda w: len(w))
print(by_len)
'''
pseudo = [
  "Three words.",
  "Sort them, using each word’s length as its sort key.",
  "Show the sorted list.",
]

[lesson.lines.2]
t = "A small function"
b = "lambda w: len(w) is a function with no name. sorted calls it on each word and sorts by what it returns."
look = "by_len is a new list."

