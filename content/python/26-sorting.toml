[[lesson]]
id = "sort_key"
topic = "Sorting"
title = "What does key= do in sorted?"
recap = "sorted(items, key=f) sorts by f(item) instead of by the item itself. Python's sort is stable: items with equal keys keep their original order. In real code, use sorted or .sort(). They run in O(n log n)."
dec = "Sort by the value key gives back, not by the item."
code = '''
words = ['pear', 'fig', 'banana', 'kiwi']
by_len = sorted(words, key=len)
print(by_len)
'''
pseudo = [
  "Four words.",
  "Sort them by their length, shortest first.",
  "Show the result.",
]

[lesson.lines.2]
t = "Sort by a key"
b = "Python works out len(word) for each word: 4, 3, 6, 4. It sorts by those numbers. pear and kiwi tie at 4, so they keep their original order: pear first."
look = "by_len is a new list. words is unchanged."

[lesson.predict]
line = 3
q = "What does print(by_len) show?"
target = { out = true }
opts = ["['fig', 'pear', 'kiwi', 'banana']", "['fig', 'kiwi', 'pear', 'banana']", "['banana', 'fig', 'kiwi', 'pear']"]

[lesson.predict.fb]
"['fig', 'kiwi', 'pear', 'banana']" = "Not quite. pear and kiwi have the same length, and a stable sort keeps them in their original order."
"['banana', 'fig', 'kiwi', 'pear']" = "Not quite. That is alphabetical order. key=len sorts by length."

