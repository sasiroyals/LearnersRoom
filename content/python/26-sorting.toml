[[lesson]]
id = "sort_merge"
topic = "Sorting"
title = "How do you merge two sorted lists?"
recap = "Merging two sorted lists compares their fronts and takes the smaller one each time. It touches every item once, so it is O(n). Merge sort splits a list in half again and again, then merges the halves: O(n log n), much faster than O(n²) sorts on big lists."
dec = "Which front item is smaller? Take that one and move that list's pointer on."
code = '''
a = [1, 4, 9]
b = [2, 3, 10]
out = []
i = j = 0
while i < len(a) and j < len(b):
    if a[i] <= b[j]:
        out.append(a[i])
        i += 1
    else:
        out.append(b[j])
        j += 1
out += a[i:] + b[j:]
print(out)
'''
pseudo = [
  "A sorted list.",
  "Another sorted list.",
  "The merged result starts empty.",
  "i points at the front of a, j at the front of b.",
  "While both lists still have items:",
  "if a's front item is smaller (or equal),",
  "take it,",
  "and move along a.",
  "Otherwise,",
  "take b's front item,",
  "and move along b.",
  "Add whatever is left in either list.",
  "Show the merged list.",
]

[lesson.lines.6]
t = "Compare the fronts"
b = "Both lists are sorted, so the smallest item left must be at one of the two fronts."
look = "a[i] and b[j] are compared."

[lesson.lines.12]
t = "Add the leftovers"
b = "One list ran out. Everything left in the other is bigger than all of out, and already sorted, so it goes on the end."
look = "out gets its last items."

[lesson.predict]
line = 12
q = "What is out after line 12 adds the leftovers?"
target = { v = "out" }
opts = ["[1, 2, 3, 4, 9, 10]", "[1, 2, 3, 4, 9]", "[1, 4, 9, 2, 3, 10]"]

[lesson.predict.fb]
"[1, 2, 3, 4, 9]" = "Not quite. That is out when the loop stops. Line 12 then adds 10, which was left over in b."
"[1, 4, 9, 2, 3, 10]" = "Not quite. That is a + b. Merging takes the smaller front item each time."

