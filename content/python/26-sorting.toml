# One [[lesson]] block per lesson, in the order students see them.
# Line numbers in lines, predict.line and pline count from 1.

topic = "26"

[[lesson]]
id = "sort_bubble"
topic = "Sorting"
title = "How does one pass of bubble sort move the biggest item?"
recap = "Bubble sort compares neighbours and swaps them when they are in the wrong order. One pass carries the biggest item to the end. n items need up to n - 1 passes, each of up to n comparisons, so bubble sort is O(n²)."
dec = "Is the left neighbour bigger than the right one? Yes: swap them. No: leave them."
code = '''
nums = [5, 1, 4, 2]
for i in range(len(nums) - 1):
    if nums[i] > nums[i + 1]:
        nums[i], nums[i + 1] = nums[i + 1], nums[i]
print(nums)
'''
pseudo = [
  "An unsorted list.",
  "For each pair of neighbours, left to right:",
  "if the left one is bigger,",
  "swap the two.",
  "Show the list after one pass.",
]

[lesson.lines.2]
t = "Walk the pairs"
b = "i goes 0, 1, 2: the pairs (0, 1), (1, 2) and (2, 3). A list of 4 items has 3 pairs of neighbours."
look = "i takes each position."

[lesson.lines.4]
t = "Swap in one line"
b = "The right side is worked out first, as a tuple of the two values. Then they are unpacked back in the opposite order."
look = "Two cells of the list change places."

[lesson.predict]
line = 5
q = "What is the list after one pass?"
target = { out = true }
opts = ["[1, 4, 2, 5]", "[1, 2, 4, 5]", "[5, 1, 4, 2]"]

[lesson.predict.fb]
"[1, 2, 4, 5]" = "Not quite. One pass only carries the biggest item, 5, to the end. 4 and 2 are never compared with each other in this pass, so they stay out of order."
"[5, 1, 4, 2]" = "Not quite. 5 is bigger than 1, so the very first comparison swaps them."

