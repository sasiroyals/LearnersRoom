[[lesson]]
id = "sort_insertion"
topic = "Sorting"
title = "How does insertion sort slide an item into place?"
recap = "Insertion sort keeps the left part of the list sorted. It takes the next item and slides it left past every bigger item. On a list that is already nearly sorted it is very fast, but in the worst case it is O(n²)."
dec = "Is the item to the left bigger than the one we hold? Yes: move it right one place. No: drop our item here."
code = '''
nums = [2, 5, 7, 3]
key = nums[3]
j = 2
while j >= 0 and nums[j] > key:
    nums[j + 1] = nums[j]
    j -= 1
nums[j + 1] = key
print(nums)
'''
pseudo = [
  "The first 3 items are sorted. 3 is not in place yet.",
  "Pick up the item to place.",
  "Start comparing with the item to its left.",
  "While that item is bigger than the one we hold,",
  "move it one place right,",
  "and look one further left.",
  "Drop the held item into the gap.",
  "Show the list.",
]

[lesson.lines.2]
t = "Pick up the item"
b = "key holds the value 3. Its old cell can now be written over, because we have a copy."
look = "key is 3."

[lesson.lines.5]
t = "Shift right"
b = "A bigger item moves one place right, leaving a gap where it was."
look = "One value is copied one cell to the right."

[lesson.lines.7]
t = "Drop it in the gap"
b = "The loop stopped at an item smaller than key (or ran off the front), so key belongs just after it."
look = "3 lands in its place."

[lesson.predict]
line = 7
q = "What is j when the while loop stops?"
target = { v = "j" }
opts = ["0", "1", "2"]

[lesson.predict.fb]
1 = "Not quite. j moves left past 7 and 5, then stops at 2, which is at position 0. 3 then lands at j + 1."
2 = "Not quite. 7 and 5 are both bigger than 3, so j moves left twice."

