# Python 25: Searching and Big-O
# One [[lesson]] block per lesson, in the order students see them.
# Line numbers in lines, predict.line and pline count from 1.

topic = "25"

[[lesson]]
id = "big_linear"
topic = "Searching and Big-O"
title = "How many checks does a linear search make?"
recap = "A linear search checks items one by one from the start. In the worst case it checks every item, so the work grows in step with the list: n items, up to n checks. That growth is written O(n)."
dec = "At each item: is it the target? Yes: stop. No: move to the next item."
code = '''
nums = [7, 3, 9, 4, 8]
target = 4
checks = 0
for n in nums:
    checks += 1
    if n == target:
        break
print(checks)
'''
pseudo = [
  "A list of 5 numbers.",
  "The number we want.",
  "Count the checks.",
  "Take each number in turn:",
  "count one check,",
  "and if it is the target,",
  "stop looking.",
  "Show how many checks it took.",
]

[lesson.lines.4]
t = "Start at the front"
b = "A linear search has no shortcut. It looks at the first item, then the next, and so on."
look = "n takes each value in turn."

[lesson.lines.5]
t = "Count the work"
b = "Each time round the loop is one comparison. Counting them is how we measure how much work a search does."
look = "checks goes up by one."

[lesson.lines.7]
t = "Found it"
b = "break leaves the loop at once. The items after 4 are never looked at."
look = "The loop ends early."

[lesson.predict]
line = 8
q = "How many checks did it take to find 4?"
target = { out = true }
opts = ["4", "5", "1"]

[lesson.predict.fb]
5 = "Not quite. 4 is the 4th item, and break stops the loop as soon as it is found."
1 = "Not quite. A linear search cannot jump to the answer. It starts at the first item."

[[lesson.variants]]
label = "target = 4"

[[lesson.variants]]
label = "target = 6 (missing)"
from = "target = 4"
to = "target = 6"
q = "6 is not in the list. How many checks?"
opts = ["5", "0", "6"]

[lesson.check]
code = '''
# a list of 1,000 names, the name you want is last
names = [...]
'''
