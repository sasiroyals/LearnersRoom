[[lesson]]
id = "poly_same"
topic = "Polymorphism"
title = "One call, different objects: which code runs?"
recap = "The loop called sh.area() on every shape without knowing its class. For the circle, Circle.area ran. For the square, Square.area ran. That is polymorphism: one call, and each object answers in its own way."
code = '''
class Circle:
    def __init__(self, r):
        self.r = r

    def area(self):
        return 3 * self.r * self.r

class Square:
    def __init__(self, s):
        self.s = s

    def area(self):
        return self.s * self.s

shapes = [Circle(1), Square(2)]
total = 0
for sh in shapes:
    total = total + sh.area()
print(total)
'''
pseudo = [
  "Define Circle.",
  "(init)",
  "(store r)",
  "(blank)",
  "A circle’s area (using 3 for pi to keep numbers small).",
  "(compute)",
  "(blank)",
  "Define Square.",
  "(init)",
  "(store s)",
  "(blank)",
  "A square’s area.",
  "(compute)",
  "(blank)",
  "Put a circle and a square in one list.",
  "Start the total at 0.",
  "For each shape:",
  "add its area. The same call runs different code for each.",
  "Show the total.",
]

[lesson.lines.15]
t = "Mixed objects in one list"
b = "The list holds objects of two different classes."
look = "The list cells point to a Circle and a Square."

[lesson.lines.18]
t = "The same line, two classes"
b = "sh.area() is one line of code. Python picks the area method from whatever class sh’s object belongs to."
look = "Which class the area frame belongs to."

[lesson.predict]
line = 19
q = "What will print(total) show?"
target = { out = true }
opts = ["7", "5", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
5 = "Not quite. The circle’s area is 3 * 1 * 1 = 3, and the square’s is 2 * 2 = 4."
"An error" = "No error. Both classes define area, so sh.area() works for each."

