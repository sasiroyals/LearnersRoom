[[lesson]]
id = "poly_duck"
topic = "Polymorphism"
title = "Does Python check the type before calling a method?"
recap = "chat worked with a Duck and a Robot, two unrelated classes, because both had a talk method. It failed with a Rock, which had none. This is duck typing: Python cares whether an object can do the job, not what class it is."
code = '''
class Duck:
    def talk(self):
        return 'Quack'

class Robot:
    def talk(self):
        return 'Beep'

class Rock:
    pass

def chat(thing):
    return thing.talk()

print(chat(Duck()))
print(chat(Robot()))
print(chat(Rock()))
'''
pseudo = [
  "Define Duck, which can talk.",
  "(talk)",
  "(return)",
  "(blank)",
  "Define Robot, which can also talk.",
  "(talk)",
  "(return)",
  "(blank)",
  "Define Rock, which cannot talk.",
  "(empty)",
  "(blank)",
  "chat asks any thing to talk.",
  "(call talk)",
  "(blank)",
  "Chat with a duck.",
  "Chat with a robot.",
  "Chat with a rock.",
]

[lesson.lines.15]
t = "Pass a Duck"
b = "chat does not check the type. It just calls talk."
look = "thing points to a Duck object."

[lesson.lines.16]
t = "Pass a Robot"
b = "Robot is unrelated to Duck, but it also has talk, so chat works."
look = "thing points to a Robot object."

[lesson.lines.17]
t = "Pass a Rock"
b = "Rock has no talk method, so the call fails with an AttributeError."
look = "The error on this line."

[lesson.predict]
line = 17
q = "What will chat(Rock()) do?"
target = { out = true }
opts = ["An error", "Print None", "Print Rock"]

[lesson.predict.fb]  # feedback for specific wrong answers
"Print None" = "Not quite. A missing method is an error, not None."
"Print Rock" = "Not quite. chat calls thing.talk(), and Rock has no talk."

