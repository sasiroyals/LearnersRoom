[[lesson]]
id = "poly_ops"
topic = "Polymorphism"
title = "How does + work on your own objects?"
recap = "a + b ran Money.__add__ and built a new Money(200). print used __repr__. c == Money(200) ran __eq__, which compared cents and said True. Without __eq__, == only checks whether both sides are the same object, which they are not."
code = '''
class Money:
    def __init__(self, cents):
        self.cents = cents

    def __add__(self, other):
        return Money(self.cents + other.cents)

    def __eq__(self, other):
        return self.cents == other.cents

    def __repr__(self):
        return 'Money(' + str(self.cents) + ')'

a = Money(150)
b = Money(50)
c = a + b
print(c)
print(c == Money(200))
'''
pseudo = [
  "Define Money.",
  "(init)",
  "(store cents)",
  "(blank)",
  "a + b means: make a new Money with both amounts added.",
  "(build)",
  "(blank)",
  "a == b means: same number of cents?",
  "(compare)",
  "(blank)",
  "Its text form.",
  "(build text)",
  "(blank)",
  "Make 150 cents.",
  "Make 50 cents.",
  "Add them.",
  "Show the sum.",
  "Compare with 200 cents.",
]

[lesson.lines.6]
t = "Build a new object"
b = "__add__ returns a brand new Money. Neither a nor b changes."
look = "A third Money object appears."

[lesson.lines.16]
t = "a + b calls __add__"
b = "For a + b, Python calls a.__add__(b). self is a and other is b."
look = "The __add__ frame, with self and other."

[lesson.lines.18]
t = "== calls __eq__"
b = "Without __eq__, == would ask \"same object?\". With it, Python compares cents."
look = "The __eq__ frame."

