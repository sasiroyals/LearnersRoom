[[lesson]]
id = "enc_property"
topic = "Encapsulation"
title = "How can a class reject a bad value?"
recap = "Outside code wrote t.c = 25 and t.c = -300 like plain attributes, but each one ran the setter. 25 passed the check and was stored. -300 was refused with a ValueError, so _c stayed 25. A property lets a class protect its data without changing how callers use it."
dec = "The setter asks one question: is the value below -273? Yes: raise ValueError and store nothing. No: store it in _c."
code = '''
class Temp:
    def __init__(self, c):
        self._c = c

    @property
    def c(self):
        return self._c

    @c.setter
    def c(self, value):
        if value < -273:
            raise ValueError('below absolute zero')
        self._c = value

t = Temp(20)
t.c = 25
t.c = -300
print(t.c)
'''
pseudo = [
  "Define Temp.",
  "When built, store the temperature in _c.",
  "(store)",
  "(blank)",
  "c is a property:",
  "reading t.c runs this method,",
  "which gives back _c.",
  "(blank)",
  "Setting t.c runs this method instead:",
  "(setter)",
  "if the value is below -273,",
  "refuse it with a ValueError.",
  "Otherwise store it.",
  "(blank)",
  "Make a Temp of 20.",
  "Set c to 25.",
  "Set c to -300.",
  "Show c.",
]

[lesson.lines.11]
t = "Check the value"
b = "The setter checks the rule before it stores anything."
look = "value in the frame."

[lesson.lines.12]
t = "Refuse"
b = "raise stops the setter with a ValueError. _c is never changed."
look = "_c still holds 25."

[lesson.lines.13]
t = "Store it"
b = "The value passed the check, so it goes into _c."
look = "_c changes on the object."

[lesson.lines.16]
t = "Set through the property"
b = "t.c = 25 looks like a plain assignment, but Python calls the setter method with value = 25."
look = "A c() frame opens with value = 25."

[lesson.lines.17]
t = "Try a bad value"
b = "The setter runs again with value = -300."
look = "Watch which branch the check takes."

[lesson.predict]
line = 17
q = "What happens on t.c = -300?"
target = { out = true }
opts = ["_c becomes -300", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
"_c becomes -300" = "Not quite. The setter checks the value first and raises a ValueError for anything below -273."

[[lesson.variants]]
label = "-300"

[[lesson.variants]]
label = "-100"
from = "t.c = -300"
to = "t.c = -100"
q = "What happens on t.c = -100?"
ok = "It is stored"
opts = ["It is stored", "An error"]

[lesson.check]  # the final unfamiliar-input question
code = '''
class Age:
    def __init__(self):
        self._a = 0
    @property
    def a(self):
        return self._a
    @a.setter
    def a(self, v):
        if v < 0:
            raise ValueError('neg')
        self._a = v

x = Age()
x.a = 5'''
q = "What is x._a now?"
opts = ["0", "5", "An error"]
right = 1
fb = [
  "Not quite. 5 passed the check and was stored.",
  "Right. The setter stored 5 in _a.",
  "Not quite. 5 is not negative, so no error.",
]
