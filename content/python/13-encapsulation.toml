topic = "13"

[[lesson]]
id = "enc_private"
topic = "Encapsulation"
title = "Does a leading underscore make a name private?"
recap = "_cash changed to 999 without any complaint. In Python, a leading underscore marks an attribute as internal by convention only. Good code respects it, and uses methods or properties to change internal data."
code = '''
class Wallet:
    def __init__(self):
        self._cash = 10

w = Wallet()
w._cash = 999
print(w._cash)
'''
pseudo = [
  "Define Wallet.",
  "When built:",
  "store _cash = 10. The underscore says: internal, please don’t touch.",
  "(blank)",
  "Build a wallet.",
  "Change _cash from outside anyway.",
  "Show it.",
]

[lesson.lines.3]
t = "An internal attribute"
b = "A single leading underscore is a naming convention. It tells other programmers the attribute is internal."
look = "_cash on the object."

[lesson.lines.6]
t = "Change it from outside"
b = "Python does not stop you. The underscore is a promise between programmers, not a lock."
look = "_cash changes."

[lesson.predict]
line = 6
q = "What happens when outside code sets w._cash = 999?"
target = { out = true }
ok = "_cash becomes 999"
opts = ["_cash becomes 999", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
"An error" = "Not quite. Python has no private keyword. _cash is just a normal attribute with a name that signals intent."

[[lesson.variants]]
label = "_cash"

[lesson.check]  # the final unfamiliar-input question
code = '''
class A:
    def __init__(self):
        self._x = 1

a = A()
print(a._x)'''
q = "What happens?"
opts = ["It prints 1", "An error"]
right = 0
fb = [
  "Right. The underscore is only a convention.",
  "Not quite. Python allows it. The underscore is a hint, not a lock.",
]

[[lesson]]
id = "enc_mangle"
topic = "Encapsulation"
title = "What does a double underscore do to a name?"
recap = "self.__code was stored as _Safe__code. Reading s.__code from outside failed with an AttributeError, but s._Safe__code still works. Double underscores prevent accidents and name clashes in subclasses. They are not real security."
code = '''
class Safe:
    def __init__(self):
        self.__code = 1234

s = Safe()
print(s.__dict__)
print(s.__code)
'''
pseudo = [
  "Define Safe.",
  "When built:",
  "store __code. Python renames it to _Safe__code.",
  "(blank)",
  "Build a safe.",
  "Show the object’s real attribute names.",
  "Try to read __code from outside.",
]

[lesson.lines.3]
t = "Name mangling"
b = "Inside a class, a name that starts with two underscores is renamed to _ClassName__name. This avoids clashes with subclasses."
look = "The attribute is stored as _Safe__code."

[lesson.lines.6]
t = "Look at the real names"
b = "__dict__ shows the attributes stored on the object."
look = "The output shows _Safe__code."

[lesson.lines.7]
t = "Read from outside"
b = "Outside the class there is no renaming, so Python looks for an attribute literally called __code, and none exists."
look = "The error on this line."

[lesson.predict]
line = 7
q = "What will print(s.__code) do?"
target = { out = true }
opts = ["Print 1234", "An error", "Print None"]

[lesson.predict.fb]  # feedback for specific wrong answers
"Print 1234" = "Not quite. The attribute was stored as _Safe__code, so __code is not found outside the class."
"Print None" = "Not quite. A missing attribute is an AttributeError, not None."

[[lesson.variants]]
label = "s.__code"

[[lesson.variants]]
label = "s._Safe__code"
from = "print(s.__code)"
to = "print(s._Safe__code)"
opts = ["Print 1234", "An error", "Print None"]
q = "What will print(s._Safe__code) do?"

