[[lesson]]
id = "exc_trace"
topic = "Exceptions"
title = "How do I read a traceback?"
recap = "Read a traceback from the bottom: the last line is the error type and message (ZeroDivisionError), and the line above it is where it happened (inside average). The lines above that show how you got there: line 8 called report, which called average."
code = '''
def average(xs):
    return sum(xs) / len(xs)

def report(xs):
    return 'avg ' + str(average(xs))

print(report([4, 6]))
print(report([]))
'''
