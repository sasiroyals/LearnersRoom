[[lesson]]
id = "exc_finally"
topic = "Exceptions"
title = "When does finally run?"
recap = "finally always runs on the way out of a try: after a return, after an error, or after normal completion. With job(0) the division fails, cleanup still runs, and then the error continues."
code = '''
log = []
def job(x):
    try:
        log.append('start')
        return 10 / x
    finally:
        log.append('cleanup')

r = job(2)
print(r, log)
'''
pseudo = [
  "An empty log.",
  "Define job:",
  "try:",
  "record start,",
  "return 10 / x.",
  "no matter what happens:",
  "record cleanup.",
  "(blank)",
  "Run the job.",
  "Show the result and the log.",
]

[lesson.lines.5]
t = "Return... but first"
b = "return is about to leave the function, but a finally block must run first."
look = "Which line runs next."

[lesson.lines.7]
t = "Always runs"
b = "finally runs whether the try block returned, finished, or raised. That makes it the place for cleanup."
look = "cleanup is added."

