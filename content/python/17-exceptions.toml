[[lesson]]
id = "exc_custom"
topic = "Exceptions"
title = "How do I write my own exception?"
recap = "Your own exception class gives a problem a clear name. raise sends it up; except OutOfStock catches only that kind, so unrelated bugs are not hidden."
dec = "Is n more than stock? Yes: raise OutOfStock, and the caller’s except handles it. No: return the rest."
code = '''
class OutOfStock(Exception):
    pass

def buy(stock, n):
    if n > stock:
        raise OutOfStock('only ' + str(stock) + ' left')
    return stock - n

try:
    left = buy(3, 5)
except OutOfStock as e:
    left = 'sorry: ' + str(e)
print(left)
'''
pseudo = [
  "A new kind of error, built on Exception.",
  "(body)",
  "(blank)",
  "Define buy:",
  "not enough?",
  "raise our own error with a message.",
  "otherwise return what is left.",
  "(blank)",
  "try:",
  "buy 5 of 3.",
  "if OutOfStock was raised, keep it as e:",
  "build a polite message.",
  "Show the result.",
]

[lesson.lines.1]
t = "A custom exception"
b = "Subclassing Exception creates a named error type. Callers can catch exactly this one."
look = "A new class appears."

[lesson.lines.6]
t = "raise"
b = "raise stops buy immediately and sends the error up to the caller."
look = "The buy() frame disappears."

[lesson.lines.12]
t = "Caught by type"
b = "except OutOfStock matches because the raised object is an OutOfStock. e is the error object, and str(e) is its message."
look = "left gets the message."

[lesson.predict]
line = 13
q = "What will print(left) show?"
target = { out = true }
opts = ["sorry: only 3 left", "-2", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
-2 = "Not quite. raise stopped buy before the subtraction."

