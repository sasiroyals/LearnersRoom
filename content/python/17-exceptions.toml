[[lesson]]
id = "exc_try"
topic = "Exceptions"
title = "Which path does try / except take?"
recap = "When a line in try raises, Python skips the rest of the try block and looks for a matching except. If none matches (KeyError does not match ValueError), the error keeps travelling up and the program stops."
dec = "Did int(text) raise? No: finish the try block. Yes, a ValueError: run the except block. Some other error: it is not caught."
code = '''
def parse(text):
    try:
        n = int(text)
        status = 'ok'
    except ValueError:
        n = 0
        status = 'bad'
    return n, status

print(parse('12'))
print(parse('x'))
'''
pseudo = [
  "Define parse:",
  "try the risky part:",
  "convert the text,",
  "note success.",
  "if conversion failed with ValueError:",
  "use 0,",
  "note failure.",
  "return both.",
  "(blank)",
  "Parse good text.",
  "Parse bad text.",
]

[lesson.lines.3]
t = "The risky line"
b = "If int() fails here, the rest of the try block is skipped and Python jumps to the matching except."
look = "Which line runs next."

[lesson.lines.6]
t = "Handled"
b = "The except block runs instead of crashing the program."
look = "n gets a fallback value."

[lesson.predict]
line = 11
q = "What will print(parse('x')) show?"
target = { out = true }
opts = ["(0, 'bad')", "An error", "(0, 'ok')"]

[lesson.predict.fb]  # feedback for specific wrong answers
"(0, 'ok')" = "Not quite. status = 'ok' was skipped when int() failed."
"An error" = "Not quite. except ValueError catches it."

