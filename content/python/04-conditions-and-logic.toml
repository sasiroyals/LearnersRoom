# Python 04: Conditions and logic
# One [[lesson]] block per lesson, in the order students see them.
# Line numbers in lines, predict.line and pline count from 1.

topic = "04"

[[lesson]]
id = "cond_branch"
topic = "Conditions and logic"
title = "Which branch runs?"
recap = "if checks its condition once. True runs the if block, False runs the else block, never both. 25 > 25 is False, so 25 went to the else branch."
dec = "One question decides the path: is temp > 25? Yes leads to \"hot\", no leads to \"mild\". Both paths then meet at print."
code = '''
temp = 30
if temp > 25:
    label = "hot"
else:
    label = "mild"
print(label)
'''
pseudo = [
  "temp is 30.",
  "Is temp above 25?",
  "Yes: label is \"hot\".",
  "Otherwise:",
  "label is \"mild\".",
  "Show label.",
]

[lesson.lines.2]
t = "Ask the question"
b = "The condition temp > 25 is worked out to True or False. Exactly one branch will run."
look = "The next highlighted line tells you which branch was chosen."

[lesson.lines.3]
t = "The if branch"
b = "The condition was True, so the indented block under if runs. The else block is skipped."
look = "label appears."

[lesson.lines.5]
t = "The else branch"
b = "The condition was False, so Python skipped the if block and ran the else block."
look = "label appears."

[lesson.lines.6]
t = "Back to the main path"
b = "Both branches lead here. The program continues after the if statement."
look = "The output box."

[lesson.predict]
line = 6
q = "What will print(label) show?"
target = { out = true }
opts = ["hot", "mild", "hot mild"]

[lesson.predict.fb]  # feedback for specific wrong answers
"hot mild" = "Not quite. Only one branch of an if / else runs."

[[lesson.variants]]
label = "temp = 30"

[[lesson.variants]]
label = "temp = 25"
from = "temp = 30"
to = "temp = 25"

[[lesson.variants]]
label = "temp = 12"
from = "temp = 30"
to = "temp = 12"

[lesson.check]  # the final unfamiliar-input question
code = '''
x = 0
if x:
    r = 'yes'
else:
