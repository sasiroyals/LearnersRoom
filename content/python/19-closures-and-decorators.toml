q = "What will print(greet('ana')) show?"
target = { out = true }
opts = ["HI ANA!", "hi ana", "An error"]

[lesson.predict.fb]  # feedback for specific wrong answers
"hi ana" = "Not quite. The name greet now refers to the wrapper, which changes the result."

