[[lesson]]
id = "clo_keep"
topic = "Closures and decorators"
title = "How does a closure keep a variable alive?"
recap = "Each call to make_multiplier created a new k and a new times that remembers it. double keeps k = 2 and triple keeps k = 3, long after make_multiplier has returned."
code = '''
def make_multiplier(k):
    def times(x):
        return x * k
    return times

double = make_multiplier(2)
triple = make_multiplier(3)
print(double(5), triple(5))
'''
pseudo = [
  "Define a factory that takes k:",
  "inside, define times(x), which uses k,",
  "times returns x * k.",
  "hand times back.",
  "(blank)",
  "Make one with k = 2.",
  "Make another with k = 3.",
  "Use both.",
]

[lesson.lines.3]
t = "Use the captured k"
b = "When double runs, k is found in the enclosing scope that was captured, not in the Main program box."
look = "The times() frame has only x."

[lesson.lines.4]
t = "Return a function"
b = "make_multiplier returns the inner function. Its frame ends, but times still needs k, so Python keeps k alive alongside times. That pairing is a closure."
look = "The frame disappears; double now refers to a function."

[lesson.predict]
