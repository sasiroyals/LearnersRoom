[[lesson]]
id = "clo_decorator"
topic = "Closures and decorators"
title = "What does a decorator do to a function?"
recap = "A decorator is a function that takes a function and returns a replacement, usually a wrapper that runs code before or after the original. @shout is exactly greet = shout(greet)."
code = '''
def shout(fn):
    def wrapper(name):
        return fn(name).upper() + '!'
    return wrapper

@shout
def greet(name):
    return 'hi ' + name

print(greet('ana'))
'''
pseudo = [
  "Define shout: it takes a function,",
  "builds a wrapper around it,",
  "the wrapper calls the original and changes the result,",
  "and returns the wrapper.",
  "(blank)",
  "Decorate the next function with shout:",
  "greet makes a greeting.",
  "(body)",
  "(blank)",
  "Call greet.",
]

[lesson.lines.6]
t = "@ is shorthand"
b = "@shout above def greet means: define greet, then run greet = shout(greet). The name greet now refers to wrapper."
look = "greet in the Main program box."

[lesson.lines.10]
t = "Call the decorated name"
b = "greet('ana') actually calls wrapper, which calls the original greet inside."
look = "Two frames appear: wrapper, then greet."

[lesson.predict]
