[[lesson]]
id = "clo_wraps"
topic = "Closures and decorators"
title = "Why use functools.wraps?"
recap = "Every decorator should use @functools.wraps(fn) on its wrapper. The behaviour is the same, but the function keeps its real name and docstring, which makes debugging and documentation honest."
code = '''
import functools

def logged(fn):
    @functools.wraps(fn)
    def wrapper(*args):
        return fn(*args)
    return wrapper

@logged
def area(w, h):
    return w * h

print(area.__name__, area(2, 3))
'''
pseudo = [
  "Load functools.",
  "(blank)",
  "Define a decorator logged:",
  "copy fn’s name and docs onto the wrapper,",
  "the wrapper passes all arguments through,",
  "(body)",
  "return it.",
  "(blank)",
  "Decorate area.",
  "area multiplies.",
  "(body)",
  "(blank)",
  "Show the name and a result.",
]

[lesson.lines.4]
t = "Keep the identity"
b = "Without wraps, the decorated function would be called wrapper in error messages, help() and logs. wraps copies the original name and docstring onto the wrapper."
look = "The wrapper is created."

[lesson.lines.13]
t = "Check the name"
b = "area.__name__ reports the original name."
look = "The output box."

[lesson.predict]
