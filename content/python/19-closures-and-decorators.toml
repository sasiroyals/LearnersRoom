q = "What will print(double(5), triple(5)) show?"
target = { out = true }
opts = ["10 15", "15 15", "10 10"]

[lesson.predict.fb]  # feedback for specific wrong answers
"15 15" = "Not quite. Each call to make_multiplier captured its own k."

