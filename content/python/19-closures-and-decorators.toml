[[lesson]]
id = "clo_nonlocal"
topic = "Closures and decorators"
title = "Why does count += 1 fail inside a closure?"
recap = "Assigning to a name inside a function makes it local, so count += 1 raised UnboundLocalError. In standard Python, the fix is one line, nonlocal count, which tells Python to rebind the enclosing variable. (This site’s runner cannot run nonlocal yet, so the second input shows the older fix: change an object, count[0], instead of rebinding the name.)"
code = '''
def counter():
    count = 0
    def inc():
        count += 1
        return count
    return inc

c = counter()
n = c()
'''
pseudo = [
  "Define counter:",
  "count starts at 0.",
  "Define inc:",
  "add one to count,",
  "return it.",
  "hand inc back.",
  "(blank)",
  "Make a counter.",
  "Call it.",
]

[lesson.lines.4]
t = "Assignment makes it local"
b = "count += 1 assigns to count, so Python treats count as a local name of inc for the whole function. Reading the local count before it has a value fails."
look = "Watch for an error."

