[lesson.check]  # the final unfamiliar-input question
code = '''
from abc import ABC, abstractmethod

class Pet(ABC):
    @abstractmethod
    def feed(self):
        pass

class Cat(Pet):
    pass

c = Cat()'''
q = "What happens?"
opts = ["A Cat is built", "A TypeError"]
right = 1
fb = [
  "Not quite. Cat did not fill in feed, so it is still abstract.",
  "Right. Cat inherits the abstract feed without filling it in.",
]

[[lesson]]
id = "abs_comp"
topic = "Abstraction and composition"
title = "What does a has-a relationship look like?"
recap = "The Car object held an Engine object, and car.start() handed the work to it. Inheritance says \"is a\" (a Duck is an Animal). Composition says \"has a\" (a Car has an Engine). Composition lets you swap or change parts without building a deep class tree."
code = '''
class Engine:
    def __init__(self, hp):
        self.hp = hp

    def start(self):
        return 'Vroom ' + str(self.hp)

class Car:
    def __init__(self, hp):
        self.engine = Engine(hp)

    def start(self):
        return self.engine.start()

car = Car(120)
print(car.start())
'''
pseudo = [
  "Define Engine.",
  "(init)",
  "(store hp)",
  "(blank)",
  "Starting an engine makes a sound with its power.",
  "(build text)",
  "(blank)",
  "Define Car. A car is not an engine; it has one.",
  "When built:",
  "build an Engine and keep it.",
  "(blank)",
  "Starting the car asks its engine to start.",
  "(delegate)",
  "(blank)",
  "Build a car with 120 hp.",
  "Start it.",
]

[lesson.lines.10]
t = "A car has an engine"
b = "The car stores an Engine object in its engine attribute. That is composition: one object built from others."
look = "An arrow from the car’s engine row to the Engine object."

[lesson.lines.15]
t = "Build a Car"
b = "Car.__init__ runs with hp = 120."
look = "The Car.__init__ frame."

[lesson.lines.16]
t = "Delegate the work"
b = "car.start() does not know how to make the sound. It passes the job to its engine."
look = "Car.start, then Engine.start frames."

[lesson.predict]
