target = { out = true }
opts = ["Vroom 120", "An error", "Car"]

[lesson.predict.fb]  # feedback for specific wrong answers
"An error" = "Not quite. Car.start calls self.engine.start(), which exists."
Car = "Not quite. start returns the engine’s text."

