[[lesson]]
id = "abs_choose"
topic = "Abstraction and composition"
title = "Should this be inheritance or composition?"
recap = "Ask \"is a\" or \"has a\". A Dog is an Animal: inheritance fits. A Car has an Engine: composition fits. Composition keeps classes small, lets you swap parts (an ElectricEngine), and avoids deep, fragile class trees."
dec = "Is the new class a kind of the other one, everywhere it is used? Yes: inherit. No, it only uses it: hold it as an attribute."
code = '''
class Engine:
    def start(self):
        return 'vroom'

class Radio:
    def play(self):
        return 'music'

class Car:
    def __init__(self):
        self.engine = Engine()
        self.radio = Radio()

    def drive(self):
        return self.engine.start()

car = Car()
print(car.drive(), car.radio.play())
'''
pseudo = [
  "An Engine can start.",
  "(body)",
  "(body)",
  "(blank)",
  "A Radio can play.",
  "(body)",
  "(body)",
  "(blank)",
  "A Car HAS an engine and a radio:",
  "when built,",
  "make an engine,",
  "make a radio.",
  "(blank)",
  "Driving asks the engine to start.",
  "(body)",
  "(blank)",
  "Build a car.",
  "Drive it and play the radio.",
]

[lesson.lines.11]
t = "Has-a"
b = "A car is not an engine and is not a radio. It has them. So it holds them as attributes instead of inheriting from them."
look = "The car object points at two part objects."

[lesson.lines.15]
t = "Delegate"
b = "Car does not know how to start; it asks its engine. This is called delegation."
look = "The call goes into Engine.start."

