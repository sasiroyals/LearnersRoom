topic = "16"

[[lesson]]
id = "abs_abc"
topic = "Abstraction and composition"
title = "Why can’t I create an abstract class?"
recap = "Shape declared area as abstract, so it can describe what every shape must do but cannot be built itself. Sq filled in area, so Sq(3) worked and gave 9. Abstraction lets you write code against \"any Shape\" while each subclass supplies the details."
code = '''
from abc import ABC, abstractmethod

class Shape(ABC):
    @abstractmethod
    def area(self):
        pass

class Sq(Shape):
    def __init__(self, s):
        self.s = s

    def area(self):
        return self.s * self.s

print(Sq(3).area())
s = Shape()
'''
pseudo = [
  "Bring in the tools for abstract classes.",
  "(blank)",
  "Define Shape as an abstract class:",
  "every shape must have an area method,",
  "but Shape itself does not say how.",
  "(no body)",
  "(blank)",
  "Define Sq as a Shape.",
  "(init)",
  "(store s)",
  "(blank)",
  "Sq fills in area.",
  "(compute)",
  "(blank)",
  "Build a square and show its area.",
  "Try to build a plain Shape.",
]

[lesson.lines.3]
t = "An abstract class"
b = "Shape promises that every shape has area, without saying how. It is a contract."
look = "In the Shape class box, area is marked abstract."

[lesson.lines.8]
t = "A concrete subclass"
b = "Sq inherits from Shape and fills in area. Nothing is left abstract."
look = "Sq’s own area method."

[lesson.lines.16]
t = "Build the abstract class"
b = "Shape still has an abstract method, so Python refuses to build it."
look = "The TypeError message names the missing method."

[lesson.predict]
line = 16
q = "What will s = Shape() do?"
target = { out = true }
opts = ["An error", "Build a Shape", "Print 0"]

[lesson.predict.fb]  # feedback for specific wrong answers
"Build a Shape" = "Not quite. Shape has an abstract method, so it cannot be built."
"Print 0" = "Not quite. Nothing is printed. Building a Shape is refused."

