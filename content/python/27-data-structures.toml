[[lesson]]
id = "ds_bst"
topic = "Data structures"
title = "How does a binary search tree decide left or right?"
recap = "In a binary search tree, everything smaller than a node goes in its left subtree and everything bigger goes in its right subtree. Each comparison skips half of a balanced tree, so search and insert are O(log n). An unbalanced tree can decay into a chain and become O(n)."
dec = "Is the new value smaller than this node? Go left. Otherwise go right. Stop at an empty spot."
code = '''
class Tree:
    def __init__(self, value):
        self.value = value
        self.left = None
        self.right = None

def insert(node, value):
    if value < node.value:
        if node.left is None:
            node.left = Tree(value)
        else:
            insert(node.left, value)
    else:
        if node.right is None:
            node.right = Tree(value)
        else:
            insert(node.right, value)

root = Tree(8)
insert(root, 3)
insert(root, 10)
insert(root, 6)
print(root.left.right.value)
'''
pseudo = [
  "A tree node holds:",
  "(set up the node)",
  "its value,",
  "an empty left branch,",
  "and an empty right branch.",
  "(blank)",
  "To insert a value below a node:",
  "if it is smaller,",
  "and the left spot is empty,",
  "put a new node there,",
  "otherwise,",
  "insert into the left subtree.",
  "If it is not smaller,",
  "and the right spot is empty,",
  "put a new node there,",
  "otherwise,",
  "insert into the right subtree.",
  "(blank)",
  "The root holds 8.",
  "Insert 3.",
  "Insert 10.",
  "Insert 6.",
  "Show the value at root, then left, then right.",
]

[lesson.lines.8]
t = "Compare"
b = "One comparison decides the whole direction. Everything in the other subtree is never looked at."
look = "value is compared with node.value."

[lesson.lines.12]
t = "Go deeper"
b = "The left spot is taken, so the same function runs again one level down. That is recursion."
look = "A new insert() frame appears."

