[[lesson]]
id = "ds_linked"
topic = "Data structures"
title = "How does a linked list connect its nodes?"
recap = "A linked list is a chain of nodes. Each node holds a value and a reference to the next node. To reach an item you follow the arrows from the head, so finding the nth item is O(n), but adding at the front is O(1): no items need to move."
dec = "Follow next from node to node until next is None."
code = '''
class Node:
    def __init__(self, value, next=None):
        self.value = value
        self.next = next

head = Node(3)
head = Node(2, head)
head = Node(1, head)
node = head
total = 0
while node is not None:
    total += node.value
    node = node.next
print(total)
'''
pseudo = [
  "A node holds:",
  "a value and a link to the next node.",
  "(store the value)",
  "(store the link)",
  "(blank)",
  "Make a node holding 3. It is the whole list.",
  "Make a node holding 2 that links to it. It becomes the head.",
  "Make a node holding 1 in front of that.",
  "Start at the head.",
  "A running total.",
  "While there is a node,",
  "add its value,",
  "and follow the link to the next one.",
  "Show the total.",
]

[lesson.lines.7]
t = "Add at the front"
b = "The new node's next points at the old head. Then head moves to the new node. Nothing else moves, so this is O(1)."
look = "A new object with an arrow to the old head."

[lesson.lines.13]
