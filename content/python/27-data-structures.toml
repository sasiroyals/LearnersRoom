[[lesson]]
id = "ds_heap"
topic = "Data structures"
title = "How does a heap always know the smallest item?"
recap = "heapq keeps a list arranged as a heap: the smallest item is always at index 0. heappush and heappop are O(log n), and reading the smallest is O(1). Use a heap for priority queues, schedulers, and \"top k\" problems."
dec = "heappop always gives back the smallest item left."
code = '''
import heapq
tasks = []
heapq.heappush(tasks, 5)
heapq.heappush(tasks, 1)
heapq.heappush(tasks, 3)
first = heapq.heappop(tasks)
print(first, tasks[0])
'''
pseudo = [
  "Use the heapq module.",
  "An empty heap (a plain list).",
  "Push priority 5.",
  "Push priority 1. It moves up to the front.",
  "Push priority 3.",
  "Pop the smallest.",
  "Show it, and the new smallest.",
]

[lesson.lines.4]
t = "Sift up"
b = "1 is smaller than its parent, 5, so they swap. The smallest item is always at index 0."
look = "tasks[0] becomes 1."

[lesson.lines.6]
t = "Pop the smallest"
b = "The front item is removed and the heap is repaired in O(log n) steps."
look = "first is the smallest."

[lesson.predict]
line = 7
q = "What does print(first, tasks[0]) show?"
target = { out = true }
opts = ["1 3", "5 1", "1 5"]

[lesson.predict.fb]
"5 1" = "Not quite. A heap is not first in, first out. It always gives back the smallest."
