[[lesson]]
id = "loop_while"
topic = "Loops"
title = "When does a while loop stop?"
recap = "A while loop checks before each pass, so the value that finally fails the check is the one left behind: 27. If the condition is False at the start, the body never runs at all."
dec = "Is n < 20? Yes: triple n and ask again. No: leave the loop and print."
code = '''
n = 1
while n < 20:
    n = n * 3
print(n)
'''
pseudo = ["n is 1.", "While n is below 20:", "triple n.", "Show n."]

[lesson.lines.2]
t = "Check first"
b = "while checks its condition before every pass. True: run the body. False: leave the loop."
look = "Which line runs next."

[lesson.lines.3]
t = "Change the condition"
b = "The body must move n toward the exit, or the loop never ends."
look = "n grows."

[lesson.lines.4]
t = "After the loop"
b = "The check was False, so the loop stopped."
look = "The output box."

[lesson.predict]
line = 4
q = "What will print(n) show?"
target = { out = true }
opts = ["27", "9", "20"]

[lesson.predict.fb]  # feedback for specific wrong answers
9 = "Not quite. 9 < 20 is still True, so the body ran once more."
20 = "Not quite. n only takes values 1, 3, 9, 27."

[[lesson.variants]]
label = "n < 20"

[[lesson.variants]]
label = "n < 9"
from = "n < 20"
to = "n < 9"
opts = ["9", "27", "3"]

[[lesson.variants]]
label = "n = 50"
from = '''
n = 1
'''
to = '''
n = 50
'''
opts = ["50", "150", "An error"]

[lesson.check]  # the final unfamiliar-input question
code = '''
k = 10
while k > 0:
    k = k - 4'''
q = "What is k at the end?"
opts = ["-2", "2", "0"]
right = 0
fb = [
  "Right. 10, 6, 2, then -2 fails the check.",
  "Not quite. 2 > 0 is True, so it ran once more.",
  "Not quite. k skips over 0: 2 - 4 is -2.",
]

[[lesson]]
id = "loop_break"
topic = "Loops"
title = "What do break and continue skip?"
recap = "Output was 1, 3, end. continue skipped printing 2 but kept looping. break stopped the loop at 4, so 4 and 5 were never printed, and n was left at 4."
dec = "For each n: is it 2? Skip to the next n. Is it 4? Leave the loop. Otherwise print it."
code = '''
for n in [1, 2, 3, 4, 5]:
    if n == 2:
        continue
    if n == 4:
        break
    print(n)
print('end')
'''
pseudo = [
  "For each n from 1 to 5:",
  "if n is 2,",
  "skip the rest of this pass.",
  "if n is 4,",
  "leave the loop completely.",
  "show n.",
  "Show end.",
]

[lesson.lines.3]
t = "continue"
b = "continue skips the rest of this pass and goes straight back to take the next item."
look = "print(n) is skipped for 2."

[lesson.lines.5]
t = "break"
b = "break leaves the loop at once. The remaining items are never taken."
look = "The next line is after the loop."

[lesson.predict]
line = 7
q = "After the loop, what is n?"
target = { v = "n" }
opts = ["4", "5", "2"]

[[lesson.variants]]
label = "continue at 2, break at 4"

[lesson.check]  # the final unfamiliar-input question
