topic = "02"

[[problem]]
id = "hm"
title = "Minutes to hours and minutes"
level = "Easy"
story = "Write hours_and_minutes(total) that turns a number of minutes into a tuple (hours, minutes). 135 minutes is (2, 15)."
hint = "// gives whole hours, % gives the minutes left over."
starter = '''
def hours_and_minutes(total):
    pass
'''
solution = '''
def hours_and_minutes(total):
    hours = total // 60
    minutes = total % 60
    return (hours, minutes)
'''
demo = '''
print(hours_and_minutes(135))
'''
[[problem.tests]]
call = "hours_and_minutes(135)"
expect = "(2, 15)"
[[problem.tests]]
call = "hours_and_minutes(59)"
expect = "(0, 59)"
[[problem.tests]]
call = "hours_and_minutes(120)"
expect = "(2, 0)"

[[problem]]
id = "even"
title = "Is it even?"
level = "Easy"
story = "Write is_even(n) that returns True when n is even and False otherwise."
hint = "An even number leaves no remainder when divided by 2."
starter = '''
def is_even(n):
    pass
'''
solution = '''
def is_even(n):
    return n % 2 == 0
'''
demo = '''
print(is_even(4))
print(is_even(7))
'''
[[problem.tests]]
call = "is_even(4)"
expect = "True"
[[problem.tests]]
call = "is_even(7)"
expect = "False"
[[problem.tests]]
call = "is_even(0)"
expect = "True"

[[problem]]
id = "digits"
title = "Add up the digits"
level = "Medium"
story = "Write digit_sum(n) that adds the digits of a positive whole number. digit_sum(472) is 4 + 7 + 2 = 13."
hint = "n % 10 is the last digit. n // 10 drops the last digit."
starter = '''
def digit_sum(n):
    pass
'''
solution = '''
def digit_sum(n):
    total = 0
    while n > 0:
        total = total + n % 10
        n = n // 10
    return total
'''
demo = '''
print(digit_sum(472))
'''
[[problem.tests]]
call = "digit_sum(472)"
expect = "13"
[[problem.tests]]
call = "digit_sum(5)"
expect = "5"
[[problem.tests]]
call = "digit_sum(1000)"
expect = "1"
