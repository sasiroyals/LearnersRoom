topic = "02"

# Beginner problems: change the program so it prints the right output.
[[problem]]
id = "average_three"
title = "Average of three"
level = "Easy"
kind = "output"
story = "The average of 4, 8 and 9 is 7.0, but this program prints something else. Fix it."
hint = "Python divides before it adds. Use brackets to add first."
starter = '''
a = 4
b = 8
c = 9
print(a + b + c / 3)
'''
solution = '''
a = 4
b = 8
c = 9
print((a + b + c) / 3)
'''
[[problem.tests]]
output = '''
7.0
'''

[[problem]]
id = "share_pizza"
title = "Share the pizza"
level = "Easy"
kind = "output"
story = "17 slices are shared by 5 people. Print how many whole slices each person gets, then how many are left over, on two lines."
hint = "// gives the whole part of a division. % gives what is left over."
starter = '''
slices = 17
people = 5
print(slices / people)
'''
solution = '''
slices = 17
people = 5
print(slices // people)
print(slices % people)
'''
[[problem.tests]]
output = '''
3
2
'''

[[problem]]
id = "hours_minutes"
title = "Hours and minutes"
level = "Easy"
kind = "output"
story = "Turn 135 minutes into hours and minutes, so the program prints 2 hours 15 minutes."
hint = "total // 60 gives the hours. total % 60 gives the minutes left over."
starter = '''
total = 135
print(total, "minutes")
'''
solution = '''
total = 135
print(total // 60, "hours", total % 60, "minutes")
'''
[[problem.tests]]
output = '''
2 hours 15 minutes
'''

[[problem]]
id = "hm"
title = "Minutes to hours and minutes"
level = "Easy"
story = "Write hours_and_minutes(total) that turns a number of minutes into a tuple (hours, minutes). 135 minutes is (2, 15)."
hint = "// gives whole hours, % gives the minutes left over."
starter = '''
def hours_and_minutes(total):
    pass
'''
solution = '''
def hours_and_minutes(total):
    hours = total // 60
    minutes = total % 60
    return (hours, minutes)
'''
demo = '''
print(hours_and_minutes(135))
'''
[[problem.tests]]
call = "hours_and_minutes(135)"
expect = "(2, 15)"
[[problem.tests]]
call = "hours_and_minutes(59)"
expect = "(0, 59)"
[[problem.tests]]
call = "hours_and_minutes(120)"
expect = "(2, 0)"

[[problem]]
id = "even"
title = "Is it even?"
level = "Easy"
story = "Write is_even(n) that returns True when n is even and False otherwise."
hint = "An even number leaves no remainder when divided by 2."
starter = '''
def is_even(n):
    pass
'''
solution = '''
def is_even(n):
    return n % 2 == 0
'''
demo = '''
print(is_even(4))
print(is_even(7))
'''
[[problem.tests]]
call = "is_even(4)"
expect = "True"
[[problem.tests]]
call = "is_even(7)"
expect = "False"
[[problem.tests]]
call = "is_even(0)"
expect = "True"

[[problem]]
id = "digits"
title = "Add up the digits"
level = "Medium"
story = "Write digit_sum(n) that adds the digits of a positive whole number. digit_sum(472) is 4 + 7 + 2 = 13."
hint = "n % 10 is the last digit. n // 10 drops the last digit."
starter = '''
def digit_sum(n):
    pass
'''
solution = '''
def digit_sum(n):
    total = 0
    while n > 0:
        total = total + n % 10
        n = n // 10
    return total
'''
demo = '''
print(digit_sum(472))
'''
[[problem.tests]]
call = "digit_sum(472)"
expect = "13"
[[problem.tests]]
call = "digit_sum(5)"
expect = "5"
[[problem.tests]]
call = "digit_sum(1000)"
expect = "1"
