topic = "02"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "full_weeks"
lesson = "num_floordiv"
title = "Full weeks"
level = "Easy"
kind = "output"
story = "days holds a number of days. Print how many full weeks it contains."
hints = ["A week has 7 days.", "// divides and drops the part after the point."]
approach = "Floor division // gives the whole number of times 7 fits into days."
gfg = "python floor division"
starter = '''
# The input is already in: days
# Write your code below and print the answer.
'''
solution = '''
print(days // 7)
'''
[[problem.tests]]
before = '''
days = 20
'''
output = '''
2
'''
[[problem.tests]]
before = '''
days = 7
'''
output = '''
1
'''
[[problem.tests]]
before = '''
days = 6
'''
output = '''
0
'''
[[problem.tests]]
before = '''
days = 365
'''
output = '''
52
'''

[[problem]]
id = "last_digit"
lesson = "num_mod"
title = "Last digit"
level = "Easy"
kind = "output"
story = "n is a whole number of 0 or more. Print its last digit."
hints = ["What is left over after dividing by 10?", "% gives the remainder: 1234 % 10 is 4."]
approach = "The remainder after dividing by 10 is exactly the last digit."
gfg = "python modulo operator"
starter = '''
# The input is already in: n
# Write your code below and print the answer.
'''
solution = '''
print(n % 10)
'''
[[problem.tests]]
before = '''
n = 1234
'''
output = '''
4
'''
[[problem.tests]]
before = '''
n = 7
'''
output = '''
7
'''
[[problem.tests]]
before = '''
n = 90
'''
output = '''
0
'''

[[problem]]
id = "money_total"
lesson = "num_float"
title = "Total to the cent"
level = "Easy"
kind = "output"
story = "price is a price in dollars and qty is how many you buy. Print the total, rounded to 2 decimal places."
hints = ["Multiply first, then round.", "round(x, 2) keeps 2 digits after the point."]
approach = "Floats can carry tiny errors, like 0.30000000000000004. round(..., 2) removes them for money."
gfg = "python round function"
starter = '''
# The input is already in: price, qty
# Write your code below and print the answer.
'''
solution = '''
print(round(price * qty, 2))
'''
[[problem.tests]]
before = '''
price = 0.1
qty = 3
'''
output = '''
0.3
'''
[[problem.tests]]
before = '''
price = 2.5
qty = 4
'''
output = '''
10.0
'''
[[problem.tests]]
before = '''
price = 1.1
qty = 3
'''
output = '''
3.3
'''

[[problem]]
id = "average3"
lesson = "num_order"
title = "Average of three"
level = "Easy"
kind = "output"
story = "a, b and c are numbers. Print their average."
hints = ["Python does / before +, so a + b + c / 3 only divides c.", "Use brackets: (a + b + c) / 3."]
approach = "Brackets make the addition happen before the division."
gfg = "python operator precedence"
starter = '''
print(a + b + c / 3)
'''
solution = '''
print((a + b + c) / 3)
'''
[[problem.tests]]
before = '''
a = 1
b = 2
c = 3
'''
output = '''
2.0
'''
[[problem.tests]]
before = '''
a = 10
b = 0
c = 5
'''
output = '''
5.0
'''
[[problem.tests]]
before = '''
a = 4
b = 4
c = 4
'''
output = '''
4.0
'''
