topic = "07"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "phone_book"
lesson = "dict_lookup"
title = "Phone book"
level = "Easy"
kind = "output"
story = "book is a dict from names to phone numbers, and name is a name that is in it. Print that person's number."
hints = ["A dict finds a value by its key.", "book[name]"]
approach = "Square brackets with a key give the value stored under it."
gfg = "python dictionary access"
starter = '''
# The input is already in: book, name
# Write your code below and print the answer.
'''
solution = '''
print(book[name])
'''
[[problem.tests]]
before = '''
book = {"ana": "555-1234", "ben": "555-9876"}
name = "ben"
'''
output = '''
555-9876
'''
[[problem.tests]]
before = '''
book = {"cy": "555-0000"}
name = "cy"
'''
output = '''
555-0000
'''

[[problem]]
id = "price_or_unknown"
lesson = "dict_get"
title = "Price or unknown"
level = "Easy"
kind = "output"
story = "prices is a dict from item names to prices, and item is an item name. Print its price, or unknown if it is not in the dict."
hints = ["prices[item] crashes with KeyError when the key is missing.", "prices.get(item, \"unknown\") gives a fallback instead."]
approach = "get returns the second argument when the key is missing, so nothing crashes."
gfg = "python dictionary get method"
starter = '''
print(prices[item])
'''
solution = '''
print(prices.get(item, "unknown"))
'''
[[problem.tests]]
before = '''
prices = {"tea": 2, "cake": 3}
item = "tea"
'''
output = '''
2
'''
[[problem.tests]]
before = '''
prices = {"tea": 2}
item = "pie"
'''
output = '''
unknown
'''

[[problem]]
id = "letter_counts"
lesson = "dict_count"
title = "Count each letter"
level = "Easy"
kind = "output"
story = "word is a word. Print a dict that maps each letter to how many times it appears, with letters in the order they first appear."
hints = ["Start with an empty dict.", "counts[ch] = counts.get(ch, 0) + 1"]
approach = "get(ch, 0) gives 0 for a new letter, so every letter starts its count correctly."
gfg = "python count frequency of characters"
starter = '''
# The input is already in: word
# Write your code below and print the answer.
'''
solution = '''
counts = {}
for ch in word:
    counts[ch] = counts.get(ch, 0) + 1
print(counts)
'''
[[problem.tests]]
before = '''
word = "banana"
'''
output = '''
{'b': 1, 'a': 3, 'n': 2}
'''
[[problem.tests]]
before = '''
word = "abc"
'''
output = '''
{'a': 1, 'b': 1, 'c': 1}
'''
[[problem.tests]]
before = '''
word = "aaa"
'''
output = '''
{'a': 3}
'''

[[problem]]
id = "order_total"
lesson = "tup_unpack"
title = "Order total"
level = "Easy"
kind = "output"
story = "orders is a list of (name, qty, price) tuples. Print the total cost of all orders: qty times price, added up."
hints = ["You can unpack a tuple right in the loop.", "for name, qty, price in orders:"]
approach = "Unpacking gives each part of the tuple its own name, which reads better than order[1] * order[2]."
gfg = "python tuple unpacking"
starter = '''
# The input is already in: orders
# Write your code below and print the answer.
'''
solution = '''
total = 0
for name, qty, price in orders:
    total = total + qty * price
print(total)
'''
[[problem.tests]]
before = '''
orders = [("pen", 2, 3), ("pad", 1, 5)]
'''
output = '''
11
'''
[[problem.tests]]
before = '''
orders = []
'''
output = '''
0
'''
[[problem.tests]]
before = '''
orders = [("cup", 4, 1)]
'''
output = '''
4
'''

[[problem]]
id = "count_unique"
lesson = "set_dedupe"
title = "Count unique values"
level = "Easy"
kind = "output"
story = "nums is a list. Print how many different values it holds."
hints = ["A set keeps one copy of each value.", "len(set(nums))"]
approach = "Turning the list into a set drops the duplicates, and len counts what is left."
gfg = "python count unique values in list"
starter = '''
# The input is already in: nums
# Write your code below and print the answer.
'''
solution = '''
print(len(set(nums)))
'''
[[problem.tests]]
before = '''
nums = [1, 2, 2, 3, 3, 3]
'''
output = '''
3
'''
[[problem.tests]]
before = '''
nums = []
'''
output = '''
0
'''
[[problem.tests]]
before = '''
nums = [7, 7]
'''
output = '''
1
'''
