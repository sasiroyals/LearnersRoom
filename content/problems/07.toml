topic = "07"

# Beginner problems: change the program so it prints the right output.
[[problem]]
id = "phone_book"
title = "Look it up"
level = "Easy"
kind = "output"
story = "Print Bo's phone number. This program stops with an error."
hint = "Dictionary keys must match exactly, capital letters included."
starter = '''
book = {"Ann": "555-1234", "Bo": "555-9876"}
print(book["bo"])
'''
solution = '''
book = {"Ann": "555-1234", "Bo": "555-9876"}
print(book["Bo"])
'''
[[problem.tests]]
output = '''
555-9876
'''

[[problem]]
id = "add_age"
title = "Add a key"
level = "Easy"
kind = "output"
story = "Add Bo, who is 13, to the dictionary before it is printed."
hint = "ages[\"Bo\"] = 13 adds a new key and value."
starter = '''
ages = {"Ann": 12}
print(ages)
'''
solution = '''
ages = {"Ann": 12}
ages["Bo"] = 13
print(ages)
'''
[[problem.tests]]
output = '''
{'Ann': 12, 'Bo': 13}
'''

[[problem]]
id = "different_words"
title = "Different words"
level = "Easy"
kind = "output"
story = "Print how many different words are in the list. The answer is 3."
hint = "set(words) keeps one copy of each word. Then use len."
starter = '''
words = ["a", "b", "a", "c", "b"]
print(len(words))
'''
solution = '''
words = ["a", "b", "a", "c", "b"]
print(len(set(words)))
'''
[[problem.tests]]
output = '''
3
'''

[[problem]]
id = "wc"
title = "Count each word"
level = "Easy"
story = "Write word_counts(text) that returns a dict mapping each word to how many times it appears."
hint = "counts.get(word, 0) gives 0 the first time a word is seen."
starter = '''
def word_counts(text):
    pass
'''
solution = '''
def word_counts(text):
    counts = {}
    for word in text.split():
        counts[word] = counts.get(word, 0) + 1
    return counts
'''
demo = '''
print(word_counts('to be or not to be'))
'''
[[problem.tests]]
call = "word_counts('a b a')"
expect = "{'a': 2, 'b': 1}"
[[problem.tests]]
call = "word_counts('')"
expect = "{}"

[[problem]]
id = "uniq"
title = "Unique and sorted"
level = "Easy"
story = "Write unique_sorted(items) that drops duplicates and returns the rest in ascending order."
hint = "A set drops duplicates. sorted() turns it back into an ordered list."
starter = '''
def unique_sorted(items):
    pass
'''
solution = '''
def unique_sorted(items):
    return sorted(set(items))
'''
demo = '''
print(unique_sorted([3, 1, 3, 2, 1]))
'''
[[problem.tests]]
call = "unique_sorted([3, 1, 3, 2, 1])"
expect = "[1, 2, 3]"
[[problem.tests]]
call = "unique_sorted([])"
expect = "[]"

[[problem]]
id = "invert"
title = "Swap keys and values"
level = "Medium"
story = "Write invert(d) that returns a new dict where every value becomes a key and every key becomes its value."
hint = "Loop with for key, value in d.items() and store result[value] = key."
starter = '''
def invert(d):
    pass
'''
solution = '''
def invert(d):
    result = {}
    for key, value in d.items():
        result[value] = key
    return result
'''
demo = '''
print(invert({'a': 1, 'b': 2}))
'''
[[problem.tests]]
call = "invert({'a': 1, 'b': 2})"
expect = "{1: 'a', 2: 'b'}"
[[problem.tests]]
call = "invert({})"
expect = "{}"
