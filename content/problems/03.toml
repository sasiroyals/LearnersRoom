topic = "03"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "first_last"
lesson = "str_index"
title = "First and last letter"
level = "Easy"
kind = "output"
story = "word holds a word. Print its first letter on one line and its last letter on the next."
hints = ["The first letter is at index 0.", "Index -1 is always the last one."]
approach = "word[0] counts from the start and word[-1] counts from the end."
gfg = "python string indexing"
starter = '''
# The input is already in: word
# Write your code below and print the answer.
'''
solution = '''
print(word[0])
print(word[-1])
'''
[[problem.tests]]
before = '''
word = "python"
'''
output = '''
p
n
'''
[[problem.tests]]
before = '''
word = "a"
'''
output = '''
a
a
'''
[[problem.tests]]
before = '''
word = "level"
'''
output = '''
l
l
'''

[[problem]]
id = "middle"
lesson = "str_slice"
title = "Drop the ends"
level = "Easy"
kind = "output"
story = "word has at least 2 letters. Print it without its first and last letter."
hints = ["A slice word[start:end] stops just before end.", "word[1:-1] starts after the first letter and stops before the last."]
approach = "Slicing from 1 to -1 skips one letter at each end."
gfg = "python string slicing"
starter = '''
# The input is already in: word
# Write your code below and print the answer.
'''
solution = '''
print(word[1:-1])
'''
[[problem.tests]]
before = '''
word = "python"
'''
output = '''
ytho
'''
[[problem.tests]]
before = '''
word = "ab"
'''
output = '''

'''
[[problem.tests]]
before = '''
word = "hello"
'''
output = '''
ell
'''

[[problem]]
id = "capitalize"
lesson = "str_immut"
title = "Capital first letter"
level = "Easy"
kind = "output"
story = "word is a lowercase word. Print it with its first letter changed to a capital."
hints = ["Strings cannot be changed in place, so word[0] = ... fails. Build a new string.", "word[0].upper() + word[1:]"]
approach = "You build a new string from a capital first letter plus the rest of the word."
gfg = "python string capitalize"
starter = '''
# The input is already in: word
# Write your code below and print the answer.
'''
solution = '''
print(word[0].upper() + word[1:])
'''
[[problem.tests]]
before = '''
word = "python"
'''
output = '''
Python
'''
[[problem.tests]]
before = '''
word = "a"
'''
output = '''
A
'''
[[problem.tests]]
before = '''
word = "london"
'''
output = '''
London
'''

[[problem]]
id = "email_domain"
lesson = "str_find"
title = "Email domain"
level = "Easy"
kind = "output"
story = "email holds an email address. Print the part after the @."
hints = ["email.find(\"@\") gives the position of the @.", "Slice from one past that position to the end."]
approach = "find tells you where the @ is, and a slice takes everything after it."
gfg = "python string find"
starter = '''
# The input is already in: email
# Write your code below and print the answer.
'''
solution = '''
at = email.find("@")
print(email[at + 1:])
'''
[[problem.tests]]
before = '''
email = "sam@mail.com"
'''
output = '''
mail.com
'''
[[problem.tests]]
before = '''
email = "a@b.org"
'''
output = '''
b.org
'''
[[problem.tests]]
before = '''
email = "first.last@school.edu"
'''
output = '''
school.edu
'''

[[problem]]
id = "receipt_line"
lesson = "str_fstring"
title = "Receipt line"
level = "Easy"
kind = "output"
story = "item is a name and price is a number. Print a receipt line like apple: $1.50, always with 2 digits after the point."
hints = ["An f-string puts values in with {item}.", "{price:.2f} shows a number with 2 decimals."]
approach = "Inside an f-string, the part after the colon controls how the number is shown."
gfg = "python f-string format"
starter = '''
# The input is already in: item, price
# Write your code below and print the answer.
'''
solution = '''
print(f"{item}: ${price:.2f}")
'''
[[problem.tests]]
before = '''
item = "apple"
price = 1.5
'''
output = '''
apple: $1.50
'''
[[problem.tests]]
before = '''
item = "pen"
price = 2
'''
output = '''
pen: $2.00
'''
[[problem.tests]]
before = '''
item = "tea"
price = 0.75
'''
output = '''
tea: $0.75
'''
