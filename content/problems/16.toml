topic = "16"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "abstract_shape"
lesson = "abs_abc"
title = "An abstract Shape"
level = "Medium"
kind = "function"
story = "Make Shape an abstract class (from abc) with an abstract method area(), so Shape() cannot be created. Then write Rectangle(w, h) that inherits from Shape and implements area()."
hints = ["class Shape(ABC): with @abstractmethod above def area(self).", "Rectangle must define area, or it is abstract too."]
approach = "An abstract method is a promise: every concrete subclass must provide it, and the abstract class itself cannot be made."
gfg = "python abstract base class"
starter = '''
from abc import ABC, abstractmethod


class Shape:
    def area(self):
        return 0


class Rectangle(Shape):
    def __init__(self, w, h):
        self.w = w
        self.h = h
'''
solution = '''
from abc import ABC, abstractmethod


class Shape(ABC):
    @abstractmethod
    def area(self):
        pass


class Rectangle(Shape):
    def __init__(self, w, h):
        self.w = w
        self.h = h

    def area(self):
        return self.w * self.h
'''
[[problem.tests]]
call = "Rectangle(2, 3).area()"
expect = "6"
[[problem.tests]]
setup = '''
try:
    Shape()
    result = "created"
except TypeError:
    result = "blocked"
'''
call = "result"
expect = "'blocked'"

[[problem]]
id = "car_engine"
lesson = "abs_comp"
title = "A Car has an Engine"
level = "Easy"
kind = "function"
story = "Engine is given. Write Car(engine) that keeps the engine it is given, and start() that returns \"Car started: \" followed by the engine's start() text."
hints = ["Composition: store the engine object on the car (self.engine = engine).", "Car.start can call self.engine.start()."]
approach = "The car does not inherit from Engine; it has one and passes work to it."
gfg = "python composition"
starter = '''
class Engine:
    def __init__(self, kind):
        self.kind = kind

    def start(self):
        return f"{self.kind} engine on"


# Write class Car here
'''
solution = '''
class Engine:
    def __init__(self, kind):
        self.kind = kind

    def start(self):
        return f"{self.kind} engine on"


class Car:
    def __init__(self, engine):
        self.engine = engine

    def start(self):
        return "Car started: " + self.engine.start()
'''
[[problem.tests]]
call = "Car(Engine(\"V8\")).start()"
expect = "'Car started: V8 engine on'"
[[problem.tests]]
call = "Car(Engine(\"electric\")).start()"
expect = "'Car started: electric engine on'"

[[problem]]
id = "stack_has_list"
lesson = "abs_choose"
title = "A Stack that has a list"
level = "Medium"
kind = "function"
story = "Write a class Stack with push(x), pop() and size(). Build it with composition: keep a list inside it rather than inheriting from list, so users cannot call list methods like insert on it."
hints = ["self._items = [] in __init__.", "push appends, pop uses self._items.pop()."]
approach = "Composition exposes only the three methods a stack needs. Inheriting from list would expose dozens."
gfg = "python stack implementation"
starter = '''
class Stack(list):
    def push(self, x):
        self.append(x)

    def size(self):
        return len(self)
'''
solution = '''
class Stack:
    def __init__(self):
        self._items = []

    def push(self, x):
        self._items.append(x)

    def pop(self):
        return self._items.pop()

    def size(self):
        return len(self._items)
'''
[[problem.tests]]
setup = '''
s = Stack()
s.push(1)
s.push(2)
'''
call = "(s.pop(), s.size())"
expect = "(2, 1)"
[[problem.tests]]
setup = '''
s = Stack()
'''
call = "(isinstance(s, list), hasattr(s, \"insert\"))"
expect = "(False, False)"
