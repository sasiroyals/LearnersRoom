topic = "10"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "add_exclaim"
lesson = "mut_immut"
title = "Exclaim without changing"
level = "Easy"
kind = "function"
story = "Write add_exclaim(words) that returns a new list with \"!\" added to the end of each word. The original list must not change."
hints = ["Build a new list instead of changing the old one.", "Append w + \"!\" for each word to a fresh list."]
approach = "Strings cannot change, so w + \"!\" makes a new string, and the new list holds those."
gfg = "python list copy vs reference"
starter = '''
def add_exclaim(words):
    # Write your code here
    pass
'''
solution = '''
def add_exclaim(words):
    out = []
    for w in words:
        out.append(w + "!")
    return out
'''
[[problem.tests]]
setup = '''
w = ["hi", "yo"]
'''
call = "(add_exclaim(w), w)"
expect = "(['hi!', 'yo!'], ['hi', 'yo'])"
[[problem.tests]]
setup = '''
w = []
'''
call = "add_exclaim(w)"
expect = "[]"

[[problem]]
id = "copy_grid"
lesson = "mut_shallow"
title = "Copy a grid"
level = "Medium"
kind = "function"
story = "Write copy_grid(grid) that returns a copy of a list of lists, so that changing the copy never changes the original, not even inside a row."
hints = ["grid.copy() copies only the outer list; the rows are still shared.", "Copy each row too: [row.copy() for row in grid]"]
approach = "Copying every inner list as well means the copy and the original share nothing that can change."
gfg = "python shallow copy vs deep copy"
starter = '''
def copy_grid(grid):
    return grid.copy()
'''
solution = '''
def copy_grid(grid):
    return [row.copy() for row in grid]
'''
[[problem.tests]]
setup = '''
g = [[1, 2], [3, 4]]
c = copy_grid(g)
c[0][0] = 9
'''
call = "(g, c)"
expect = "([[1, 2], [3, 4]], [[9, 2], [3, 4]])"
[[problem.tests]]
setup = '''
g = []
'''
call = "copy_grid(g)"
expect = "[]"

[[problem]]
id = "clone_scores"
lesson = "mut_deep"
title = "Clone nested data"
level = "Medium"
kind = "function"
story = "Write clone_scores(scores) for a dict of lists such as {\"ann\": [1, 2]}. Return a copy where changing any list in the copy does not touch the original."
hints = ["copy.deepcopy copies every level.", "import copy, then return copy.deepcopy(scores)"]
approach = "deepcopy walks the whole structure and copies each object inside it."
gfg = "python deepcopy"
starter = '''
def clone_scores(scores):
    return dict(scores)
'''
solution = '''
import copy

def clone_scores(scores):
    return copy.deepcopy(scores)
'''
[[problem.tests]]
setup = '''
s = {"ann": [1, 2]}
c = clone_scores(s)
c["ann"].append(3)
'''
call = "(s, c)"
expect = "({'ann': [1, 2]}, {'ann': [1, 2, 3]})"

[[problem]]
id = "remove_negatives"
lesson = "mut_param"
title = "Remove negatives in place"
level = "Medium"
kind = "function"
story = "Write remove_negatives(nums) that removes every negative number from the list it is given. Change that list itself; do not return a new one."
hints = ["The caller keeps its own name for the list, so you must change that same list object.", "nums[:] = [n for n in nums if n >= 0] replaces the contents in place."]
approach = "Slice assignment replaces the items of the existing list, so the caller sees the change."
gfg = "python modify list in function"
starter = '''
def remove_negatives(nums):
    nums = [n for n in nums if n >= 0]
'''
solution = '''
def remove_negatives(nums):
    nums[:] = [n for n in nums if n >= 0]
'''
[[problem.tests]]
setup = '''
a = [1, -2, 3, -4]
remove_negatives(a)
'''
call = "a"
expect = "[1, 3]"
[[problem.tests]]
setup = '''
a = [-1]
remove_negatives(a)
'''
call = "a"
expect = "[]"
[[problem.tests]]
setup = '''
a = []
remove_negatives(a)
'''
call = "a"
expect = "[]"
