topic = "04"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "even_odd"
lesson = "cond_branch"
title = "Even or odd"
level = "Easy"
kind = "output"
story = "n is a whole number. Print even if it is even, otherwise print odd."
hints = ["A number is even when dividing by 2 leaves nothing over.", "if n % 2 == 0:"]
approach = "n % 2 is 0 for even numbers and 1 for odd ones, so one test chooses the branch."
gfg = "python check even or odd"
starter = '''
# The input is already in: n
# Write your code below and print the answer.
'''
solution = '''
if n % 2 == 0:
    print("even")
else:
    print("odd")
'''
[[problem.tests]]
before = '''
n = 4
'''
output = '''
even
'''
[[problem.tests]]
before = '''
n = 7
'''
output = '''
odd
'''
[[problem.tests]]
before = '''
n = 0
'''
output = '''
even
'''
[[problem.tests]]
before = '''
n = -3
'''
output = '''
odd
'''

[[problem]]
id = "pass_fail"
lesson = "cond_boundary"
title = "Pass or fail"
level = "Easy"
kind = "output"
story = "score is a mark from 0 to 100. Print pass if it is 50 or more, otherwise fail."
hints = ["\"50 or more\" includes 50 itself.", "Use >= rather than >."]
approach = ">= includes the boundary, so exactly 50 passes."
gfg = "python comparison operators"
starter = '''
if score > 50:
    print("pass")
else:
    print("fail")
'''
solution = '''
if score >= 50:
    print("pass")
else:
    print("fail")
'''
[[problem.tests]]
before = '''
score = 50
'''
output = '''
pass
'''
[[problem.tests]]
before = '''
score = 49
'''
output = '''
fail
'''
[[problem.tests]]
before = '''
score = 100
'''
output = '''
pass
'''
[[problem.tests]]
before = '''
score = 0
'''
output = '''
fail
'''

[[problem]]
id = "leap_year"
lesson = "cond_and"
title = "Leap year"
level = "Easy"
kind = "output"
story = "year is a year. Print leap if it is a leap year, otherwise print not leap. A leap year divides by 4, except years that divide by 100, which must also divide by 400."
hints = ["Two ways to be a leap year: divisible by 400, or divisible by 4 but not by 100.", "Combine the tests with and / or, and use brackets to keep them clear."]
approach = "The or covers the 400 rule; the and covers the 4-but-not-100 rule."
gfg = "python program to check leap year"
starter = '''
# The input is already in: year
# Write your code below and print the answer.
'''
solution = '''
if year % 400 == 0 or (year % 4 == 0 and year % 100 != 0):
    print("leap")
else:
    print("not leap")
'''
[[problem.tests]]
before = '''
year = 2024
'''
output = '''
leap
'''
[[problem.tests]]
before = '''
year = 1900
'''
output = '''
not leap
'''
[[problem.tests]]
before = '''
year = 2000
'''
output = '''
leap
'''
[[problem.tests]]
before = '''
year = 2023
'''
output = '''
not leap
'''

[[problem]]
id = "grade"
lesson = "cond_elif"
title = "Letter grade"
level = "Easy"
kind = "output"
story = "score is a mark from 0 to 100. Print A for 90 or more, B for 80 or more, C for 70 or more, and F for anything lower."
hints = ["Only the first true branch of an if / elif chain runs.", "Check the highest grade first."]
approach = "Checking from the top down means each elif only sees scores below the ones above it."
gfg = "python if elif else"
starter = '''
if score >= 70:
    print("C")
elif score >= 80:
    print("B")
elif score >= 90:
    print("A")
else:
    print("F")
'''
solution = '''
if score >= 90:
    print("A")
elif score >= 80:
    print("B")
elif score >= 70:
    print("C")
else:
    print("F")
'''
[[problem.tests]]
before = '''
score = 95
'''
output = '''
A
'''
[[problem.tests]]
before = '''
score = 80
'''
output = '''
B
'''
[[problem.tests]]
before = '''
score = 72
'''
output = '''
C
'''
[[problem.tests]]
before = '''
score = 10
'''
output = '''
F
'''
