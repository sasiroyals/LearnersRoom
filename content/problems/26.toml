topic = "26"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "bubble_sort"
lesson = "sort_bubble"
title = "Bubble sort"
level = "Medium"
kind = "function"
story = "Write bubble_sort(nums) that returns a new list sorted smallest first, by repeatedly swapping neighbours that are out of order. Do not use sorted() or .sort()."
hints = ["Work on a copy: out = list(nums).", "Each full pass moves the biggest remaining item to the end. Stop early if a pass makes no swaps."]
approach = "O(n^2) comparisons in the worst case, but the early stop makes an already-sorted list O(n)."
gfg = "bubble sort python"
starter = '''
def bubble_sort(nums):
    # Write your code here
    pass
'''
solution = '''
def bubble_sort(nums):
    out = list(nums)
    n = len(out)
    for end in range(n - 1, 0, -1):
        swapped = False
        for i in range(end):
            if out[i] > out[i + 1]:
                out[i], out[i + 1] = out[i + 1], out[i]
                swapped = True
        if not swapped:
            break
    return out
'''
[[problem.tests]]
call = "bubble_sort([5, 1, 4, 2])"
expect = "[1, 2, 4, 5]"
[[problem.tests]]
call = "bubble_sort([])"
expect = "[]"
[[problem.tests]]
call = "bubble_sort([1, 2, 3])"
expect = "[1, 2, 3]"

[[problem]]
id = "insert_sorted"
lesson = "sort_insertion"
title = "Insert into a sorted list"
level = "Easy"
kind = "function"
story = "nums is sorted. Write insert_sorted(nums, x) that returns a new sorted list with x added in the right place. Do not sort the whole list again."
hints = ["Find the first position where the item is bigger than x.", "Return nums[:i] + [x] + nums[i:]."]
approach = "This is the inner step of insertion sort: one O(n) slide instead of an O(n log n) sort."
gfg = "insertion sort python"
starter = '''
def insert_sorted(nums, x):
    # Write your code here
    pass
'''
solution = '''
def insert_sorted(nums, x):
    i = 0
    while i < len(nums) and nums[i] <= x:
        i += 1
    return nums[:i] + [x] + nums[i:]
'''
[[problem.tests]]
call = "insert_sorted([1, 3, 5], 4)"
expect = "[1, 3, 4, 5]"
[[problem.tests]]
call = "insert_sorted([], 2)"
expect = "[2]"
[[problem.tests]]
call = "insert_sorted([1, 2], 9)"
expect = "[1, 2, 9]"

[[problem]]
id = "merge_sorted"
lesson = "sort_merge"
title = "Merge two sorted lists"
level = "Medium"
kind = "function"
story = "Write merge(a, b) that merges two sorted lists into one sorted list, walking both lists once."
hints = ["Keep a position in each list and take the smaller front item each time.", "When one list runs out, add the rest of the other."]
approach = "Each item is looked at once: O(len(a) + len(b)). This is the merge step of merge sort."
gfg = "merge two sorted arrays"
starter = '''
def merge(a, b):
    # Write your code here
    pass
'''
solution = '''
def merge(a, b):
    i = j = 0
    out = []
    while i < len(a) and j < len(b):
        if a[i] <= b[j]:
            out.append(a[i])
            i += 1
        else:
            out.append(b[j])
            j += 1
    return out + a[i:] + b[j:]
'''
[[problem.tests]]
call = "merge([1, 4, 9], [2, 3, 10])"
expect = "[1, 2, 3, 4, 9, 10]"
[[problem.tests]]
call = "merge([], [1])"
expect = "[1]"
[[problem.tests]]
call = "merge([5], [])"
expect = "[5]"

[[problem]]
id = "sort_people"
lesson = "sort_key"
title = "Sort by two keys"
level = "Medium"
kind = "function"
story = "people is a list of (name, age) tuples. Write sort_people(people) that returns them sorted by age, youngest first, and by name for people of the same age."
hints = ["key can return a tuple: Python compares the first part, then the second.", "sorted(people, key=lambda p: (p[1], p[0]))"]
approach = "Tuples compare item by item, so (age, name) sorts by age first and breaks ties by name."
gfg = "python sort list of tuples"
starter = '''
def sort_people(people):
    # Write your code here
    pass
'''
solution = '''
def sort_people(people):
    return sorted(people, key=lambda p: (p[1], p[0]))
'''
[[problem.tests]]
call = "sort_people([(\"cy\", 30), (\"ann\", 25), (\"bo\", 30)])"
expect = "[('ann', 25), ('bo', 30), ('cy', 30)]"
[[problem.tests]]
call = "sort_people([])"
expect = "[]"
