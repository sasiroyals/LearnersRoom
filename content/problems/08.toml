topic = "08"

[[problem]]
id = "clamp"
title = "Clamp a number"
level = "Easy"
story = "Write clamp(n, low, high) that returns n, but never less than low and never more than high."
hint = "Two ifs: one for too small, one for too big. Otherwise return n unchanged."
starter = '''
def clamp(n, low, high):
    pass
'''
solution = '''
def clamp(n, low, high):
    if n < low:
        return low
    if n > high:
        return high
    return n
'''
demo = '''
print(clamp(15, 0, 10))
'''
[[problem.tests]]
call = "clamp(15, 0, 10)"
expect = "10"
[[problem.tests]]
call = "clamp(-3, 0, 10)"
expect = "0"
[[problem.tests]]
call = "clamp(5, 0, 10)"
expect = "5"

[[problem]]
id = "label"
title = "Price label"
level = "Easy"
story = "Write label(name, price) that returns text like 'Tea: $3'."
hint = "Return the text, do not print it. str(price) turns the number into text."
starter = '''
def label(name, price):
    pass
'''
solution = '''
def label(name, price):
    return name + ': $' + str(price)
'''
demo = '''
print(label('Tea', 3))
'''
[[problem.tests]]
call = "label('Tea', 3)"
expect = "'Tea: $3'"
[[problem.tests]]
call = "label('Cake', 12)"
expect = "'Cake: $12'"

[[problem]]
id = "area"
title = "Area with a default"
level = "Easy"
story = "Write area(width, height=None). With one argument it is a square, so height equals width."
hint = "Check height is None, and if so use width for it."
starter = '''
def area(width, height=None):
    pass
'''
solution = '''
def area(width, height=None):
    if height is None:
        height = width
    return width * height
'''
demo = '''
print(area(3))
print(area(3, 4))
'''
[[problem.tests]]
call = "area(3)"
expect = "9"
[[problem.tests]]
call = "area(3, 4)"
expect = "12"
