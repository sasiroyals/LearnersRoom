topic = "01"

# Beginner problems: change the program so it prints the right output.
[[problem]]
id = "use_name"
title = "Use a name"
level = "Easy"
kind = "output"
story = "Change the last line so it prints Hi Ava, using the name called name."
hint = "print can show two things if you put a comma between them: print(\"Hi\", name)."
starter = '''
name = "Ava"
print("Hi")
'''
solution = '''
name = "Ava"
print("Hi", name)
'''
[[problem.tests]]
output = '''
Hi Ava
'''

[[problem]]
id = "add_points"
title = "Add points"
level = "Easy"
kind = "output"
story = "Add a line that adds 5 to score, so the program prints 15."
hint = "score = score + 5 works out the right side first, then moves the name."
starter = '''
score = 10
# add 5 to score on the next line

print(score)
'''
solution = '''
score = 10
score = score + 5
print(score)
'''
[[problem.tests]]
output = '''
15
'''

[[problem]]
id = "text_to_number"
title = "Text to number"
level = "Easy"
kind = "output"
story = "age holds the text \"15\". Make the last line print 16."
hint = "int(age) turns the text \"15\" into the number 15."
starter = '''
age = "15"
print(age + 1)
'''
solution = '''
age = "15"
print(int(age) + 1)
'''
[[problem.tests]]
output = '''
16
'''

[[problem]]
id = "swap"
title = "Swap two values"
level = "Easy"
story = "Write swap(a, b) so it returns the two values in the opposite order, as a tuple."
hint = "A tuple is written with a comma: (b, a)."
starter = '''
def swap(a, b):
    # return the two values swapped
    pass
'''
solution = '''
def swap(a, b):
    return (b, a)
'''
demo = '''
x, y = swap(1, 2)
print(x, y)
'''
[[problem.tests]]
call = "swap(1, 2)"
expect = "(2, 1)"
[[problem.tests]]
call = "swap('left', 'right')"
expect = "('right', 'left')"

[[problem]]
id = "greet"
title = "Build a greeting"
level = "Easy"
story = "Write greet(name) that returns 'Hello, ' followed by the name and an exclamation mark."
hint = "Join strings with +. Do not forget the comma and space after Hello."
starter = '''
def greet(name):
    pass
'''
solution = '''
def greet(name):
    message = 'Hello, ' + name + '!'
    return message
'''
demo = '''
print(greet('Ana'))
'''
[[problem.tests]]
call = "greet('Ana')"
expect = "'Hello, Ana!'"
[[problem.tests]]
call = "greet('Sam')"
expect = "'Hello, Sam!'"

[[problem]]
id = "addtext"
title = "Add numbers typed as text"
level = "Easy"
story = "Input always arrives as text. Write add_text(a, b) that takes two strings like '7' and '5' and returns their sum as a number."
hint = "'7' + '5' glues text into '75'. Convert each with int() first."
starter = '''
def add_text(a, b):
    pass
'''
solution = '''
def add_text(a, b):
    first = int(a)
    second = int(b)
    return first + second
'''
demo = '''
print(add_text('7', '5'))
'''
[[problem.tests]]
call = "add_text('7', '5')"
expect = "12"
[[problem.tests]]
call = "add_text('10', '0')"
expect = "10"
