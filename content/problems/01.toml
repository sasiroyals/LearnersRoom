topic = "01"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "swap"
lesson = "val_assign"
title = "Swap two values"
level = "Easy"
kind = "output"
story = "Two numbers are stored in a and b. Swap them so that a holds b's old value and b holds a's old value. Then print a, then b, on separate lines."
hints = ["If you write a = b first, a's old value is lost. Save it in another name first.", "Python can also swap in one line: a, b = b, a."]
approach = "a, b = b, a works out both values on the right first, then gives them to the names on the left, so nothing is lost."
gfg = "python swap two variables"
starter = '''
# The input is already in: a, b
# Write your code below and print the answer.
'''
solution = '''
a, b = b, a
print(a)
print(b)
'''
[[problem.tests]]
before = '''
a = 1
b = 2
'''
output = '''
2
1
'''
[[problem.tests]]
before = '''
a = 50
b = -3
'''
output = '''
-3
50
'''
[[problem.tests]]
before = '''
a = 7
b = 7
'''
output = '''
7
7
'''

[[problem]]
id = "score_update"
lesson = "val_keep"
title = "Update the score"
level = "Easy"
kind = "output"
story = "score is given. Add 10 to it, then double it, then print the final score."
hints = ["score + 10 on its own works out a value but does not change score.", "Write score = score + 10 so the name points at the new value."]
approach = "Each line works out a new value and points score at it. The second line uses the score from the first."
gfg = "python variables assignment"
starter = '''
score + 10
score * 2
print(score)
'''
solution = '''
score = score + 10
score = score * 2
print(score)
'''
[[problem.tests]]
before = '''
score = 5
'''
output = '''
30
'''
[[problem.tests]]
before = '''
score = 0
'''
output = '''
20
'''
[[problem.tests]]
before = '''
score = -10
'''
output = '''
0
'''

[[problem]]
id = "join_or_add"
lesson = "val_strnum"
title = "Join or add?"
level = "Easy"
kind = "output"
story = "a and b hold digits as text, like \"3\" and \"4\". Print them joined together on the first line (34), and their sum as numbers on the second line (7)."
hints = ["a + b on two pieces of text joins them.", "int(a) turns the text \"3\" into the number 3."]
approach = "+ joins text and adds numbers. Converting with int() first changes which one happens."
gfg = "python type conversion"
starter = '''
# The input is already in: a, b
# Write your code below and print the answer.
'''
solution = '''
print(a + b)
print(int(a) + int(b))
'''
[[problem.tests]]
before = '''
a = "3"
b = "4"
'''
output = '''
34
7
'''
[[problem.tests]]
before = '''
a = "10"
b = "5"
'''
output = '''
105
15
'''
[[problem.tests]]
before = '''
a = "0"
b = "9"
'''
output = '''
09
9
'''

[[problem]]
id = "age_next_year"
lesson = "val_int"
title = "Age next year"
level = "Easy"
kind = "output"
story = "age_text holds an age as text, for example \"15\". Print the age the person will be next year."
hints = ["You cannot add 1 to text. Convert it first.", "int(age_text) + 1"]
approach = "int() turns the text into a number, and then + 1 is normal maths."
gfg = "python int function"
starter = '''
print(age_text + 1)
'''
solution = '''
print(int(age_text) + 1)
'''
[[problem.tests]]
before = '''
age_text = "15"
'''
output = '''
16
'''
[[problem.tests]]
before = '''
age_text = "0"
'''
output = '''
1
'''
[[problem.tests]]
before = '''
age_text = "99"
'''
output = '''
100
'''
