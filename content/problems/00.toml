topic = "00"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "banner"
lesson = "start_print"
title = "Print a banner"
level = "Easy"
kind = "output"
story = "Print this banner exactly, one line at a time:\n\n*****\nHi!\n*****"
hints = ["Each print(...) shows one line.", "Text goes in quotes: print(\"*****\")."]
approach = "Three print lines, each with its text in quotes, in the order the banner shows."
gfg = "python print function"
starter = '''
# Print the banner below.
'''
solution = '''
print("*****")
print("Hi!")
print("*****")
'''
[[problem.tests]]
output = '''
*****
Hi!
*****
'''

[[problem]]
id = "greet_name"
lesson = "start_names"
title = "Greet by name"
level = "Easy"
kind = "output"
story = "A name is stored in name. Print Hello followed by the name, with a space between them."
hints = ["The name is already in name, so do not put it in quotes.", "print(\"Hello\", name) puts a space between the two parts."]
approach = "print can show several things separated by commas. Text in quotes is shown as it is; name without quotes is looked up."
gfg = "python variables"
starter = '''
# The input is already in: name
# Write your code below and print the answer.
'''
solution = '''
print("Hello", name)
'''
[[problem.tests]]
before = '''
name = "Sam"
'''
output = '''
Hello Sam
'''
[[problem.tests]]
before = '''
name = "Ava"
'''
output = '''
Hello Ava
'''
[[problem.tests]]
before = '''
name = "Lee"
'''
output = '''
Hello Lee
'''

[[problem]]
id = "fix_total"
lesson = "start_errors"
title = "Fix the crash"
level = "Easy"
kind = "output"
story = "price and qty are given. The program should print the total cost, price times qty, but it stops with an error. Find the mistake and fix it."
hints = ["Run it and read the error. Which line does it name?", "Names are case sensitive: Total and total are different names."]
approach = "The program created total with a small t, then asked for Total with a capital T. Using the same spelling fixes it."
gfg = "python nameerror"
starter = '''
total = price * qty
print(Total)
'''
solution = '''
total = price * qty
print(total)
'''
[[problem.tests]]
before = '''
price = 3
qty = 4
'''
output = '''
12
'''
[[problem.tests]]
before = '''
price = 10
qty = 0
'''
output = '''
0
'''
[[problem.tests]]
before = '''
price = 7
qty = 5
'''
output = '''
35
'''
