topic = "13"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "thermo"
lesson = "enc_private"
title = "Internal temperature"
level = "Easy"
kind = "function"
story = "Write a class Thermo made with Thermo(celsius). Keep the value in an internal attribute _celsius and give a method fahrenheit() that returns celsius * 9 / 5 + 32."
hints = ["A leading underscore tells other programmers the attribute is internal.", "self._celsius = celsius"]
approach = "The underscore is a convention: code outside the class should use fahrenheit(), not the internal value."
gfg = "python private variables"
starter = '''
class Thermo:
    # Write your code here
    pass
'''
solution = '''
class Thermo:
    def __init__(self, celsius):
        self._celsius = celsius

    def fahrenheit(self):
        return self._celsius * 9 / 5 + 32
'''
[[problem.tests]]
call = "Thermo(100).fahrenheit()"
expect = "212.0"
[[problem.tests]]
call = "Thermo(0).fahrenheit()"
expect = "32.0"
[[problem.tests]]
call = "Thermo(-40).fahrenheit()"
expect = "-40.0"

[[problem]]
id = "wallet"
lesson = "enc_mangle"
title = "A hidden balance"
level = "Medium"
kind = "function"
story = "Write a class Wallet made with Wallet(amount). Store the money in a double-underscore attribute __money so it is name-mangled, and give a method balance() that returns it."
hints = ["Inside the class you write self.__money as normal.", "From outside, wallet.__money does not exist: Python renamed it to _Wallet__money."]
approach = "Two leading underscores make Python rename the attribute, so it is hard to touch from outside by accident."
gfg = "python name mangling"
starter = '''
class Wallet:
    def __init__(self, amount):
        self.money = amount

    def balance(self):
        return self.money
'''
solution = '''
class Wallet:
    def __init__(self, amount):
        self.__money = amount

    def balance(self):
        return self.__money
'''
[[problem.tests]]
setup = '''
w = Wallet(10)
'''
call = "(w.balance(), hasattr(w, \"money\"), hasattr(w, \"_Wallet__money\"))"
expect = "(10, False, True)"

[[problem]]
id = "age_property"
lesson = "enc_property"
title = "Reject a bad age"
level = "Medium"
kind = "function"
story = "Write a class Person made with Person(age). age must be a property: reading it gives the age, and setting it to a negative number raises ValueError and keeps the old age."
hints = ["@property makes a method that reads like an attribute.", "Add @age.setter and raise ValueError when value < 0."]
approach = "Every assignment to age goes through the setter, so a bad value is rejected before it is stored."
gfg = "python property decorator"
starter = '''
class Person:
    def __init__(self, age):
        self.age = age
'''
solution = '''
class Person:
    def __init__(self, age):
        self.age = age

    @property
    def age(self):
        return self._age

    @age.setter
    def age(self, value):
        if value < 0:
            raise ValueError("age cannot be negative")
        self._age = value
'''
[[problem.tests]]
setup = '''
p = Person(30)
try:
    p.age = -1
    result = "accepted"
except ValueError:
    result = "rejected"
'''
call = "(result, p.age)"
expect = "('rejected', 30)"
[[problem.tests]]
setup = '''
p = Person(5)
p.age = 6
'''
call = "p.age"
expect = "6"
