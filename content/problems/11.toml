topic = "11"

[[problem]]
id = "squares"
title = "List of squares"
level = "Easy"
story = "Write squares(n) that returns [1, 4, 9, ..., n*n] in one list comprehension."
hint = "range(1, n + 1) counts 1 to n. Put i * i in front of the for."
starter = '''
def squares(n):
    pass
'''
solution = '''
def squares(n):
    return [i * i for i in range(1, n + 1)]
'''
demo = '''
print(squares(4))
'''
[[problem.tests]]
call = "squares(4)"
expect = "[1, 4, 9, 16]"
[[problem.tests]]
call = "squares(0)"
expect = "[]"

[[problem]]
id = "long"
title = "Keep the long words"
level = "Easy"
story = "Write long_words(words) that keeps only words with more than 3 letters, using a comprehension with if."
hint = "The if goes at the end: [w for w in words if ...]."
starter = '''
def long_words(words):
    pass
'''
solution = '''
def long_words(words):
    return [w for w in words if len(w) > 3]
'''
demo = '''
print(long_words(['a', 'tree', 'sun', 'river']))
'''
[[problem.tests]]
call = "long_words(['a', 'tree', 'sun', 'river'])"
expect = "['tree', 'river']"
[[problem.tests]]
call = "long_words([])"
expect = "[]"

[[problem]]
id = "lens"
title = "Word lengths as a dict"
level = "Medium"
story = "Write lengths(words) that returns a dict from each word to its length, using a dict comprehension."
hint = "A dict comprehension uses key: value in curly braces."
starter = '''
def lengths(words):
    pass
'''
solution = '''
def lengths(words):
    return {w: len(w) for w in words}
'''
demo = '''
print(lengths(['hi', 'tea']))
'''
[[problem.tests]]
call = "lengths(['hi', 'tea'])"
expect = "{'hi': 2, 'tea': 3}"
[[problem.tests]]
call = "lengths([])"
expect = "{}"
