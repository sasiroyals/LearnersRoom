topic = "11"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "squares"
lesson = "comp_loop"
title = "List of squares"
level = "Easy"
kind = "function"
story = "Write squares(n) that returns [1, 4, 9, ..., n*n] using a list comprehension."
hints = ["range(1, n + 1) gives 1 up to n.", "[i * i for i in range(1, n + 1)]"]
approach = "A comprehension is a loop that collects one value per pass into a new list."
gfg = "python list comprehension"
starter = '''
def squares(n):
    # Write your code here
    pass
'''
solution = '''
def squares(n):
    return [i * i for i in range(1, n + 1)]
'''
[[problem.tests]]
call = "squares(4)"
expect = "[1, 4, 9, 16]"
[[problem.tests]]
call = "squares(0)"
expect = "[]"
[[problem.tests]]
call = "squares(1)"
expect = "[1]"

[[problem]]
id = "long_words"
lesson = "comp_filter"
title = "Words longer than n"
level = "Easy"
kind = "function"
story = "Write long_words(words, n) that returns the words with more than n letters, in order."
hints = ["Add an if at the end of the comprehension.", "[w for w in words if len(w) > n]"]
approach = "The if part keeps only the words that pass the test."
gfg = "python filter list comprehension"
starter = '''
def long_words(words, n):
    # Write your code here
    pass
'''
solution = '''
def long_words(words, n):
    return [w for w in words if len(w) > n]
'''
[[problem.tests]]
call = "long_words([\"a\", \"tree\", \"go\", \"house\"], 2)"
expect = "['tree', 'house']"
[[problem.tests]]
call = "long_words([], 3)"
expect = "[]"

[[problem]]
id = "word_lengths"
lesson = "comp_dictset"
title = "Word lengths"
level = "Easy"
kind = "function"
story = "Write word_lengths(words) that returns a dict mapping each word to its length, using a dict comprehension."
hints = ["A dict comprehension uses key: value.", "{w: len(w) for w in words}"]
approach = "Each word becomes a key, and its length becomes the value."
gfg = "python dictionary comprehension"
starter = '''
def word_lengths(words):
    # Write your code here
    pass
'''
solution = '''
def word_lengths(words):
    return {w: len(w) for w in words}
'''
[[problem.tests]]
call = "word_lengths([\"hi\", \"sun\"])"
expect = "{'hi': 2, 'sun': 3}"
[[problem.tests]]
call = "word_lengths([])"
expect = "{}"
