topic = "15"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "total_area"
lesson = "poly_same"
title = "Total area of mixed shapes"
level = "Easy"
kind = "function"
story = "Square and Rect are given; each has area(). Write total_area(shapes) that returns the sum of the areas of all the shapes in the list."
hints = ["Do not check the type: just call s.area() on each one.", "sum(s.area() for s in shapes)"]
approach = "One call, s.area(), runs different code depending on the object: that is polymorphism."
gfg = "python polymorphism"
starter = '''
class Square:
    def __init__(self, side):
        self.side = side

    def area(self):
        return self.side * self.side


class Rect:
    def __init__(self, w, h):
        self.w = w
        self.h = h

    def area(self):
        return self.w * self.h


def total_area(shapes):
    # Write your code here
    pass
'''
solution = '''
class Square:
    def __init__(self, side):
        self.side = side

    def area(self):
        return self.side * self.side


class Rect:
    def __init__(self, w, h):
        self.w = w
        self.h = h

    def area(self):
        return self.w * self.h


def total_area(shapes):
    return sum(s.area() for s in shapes)
'''
[[problem.tests]]
call = "total_area([Square(2), Rect(2, 3)])"
expect = "10"
[[problem.tests]]
call = "total_area([])"
expect = "0"

[[problem]]
id = "all_speak"
lesson = "poly_duck"
title = "Anything that speaks"
level = "Easy"
kind = "function"
story = "Write all_speak(things) that returns a list of what each thing says, by calling its speak() method. Duck and Robot are given and share no parent class."
hints = ["Python does not care about the class, only that the method exists.", "[t.speak() for t in things]"]
approach = "Duck typing: if it has speak(), you can call it, whatever its class."
gfg = "python duck typing"
starter = '''
class Duck:
    def speak(self):
        return "quack"


class Robot:
    def speak(self):
        return "beep"


def all_speak(things):
    # Write your code here
    pass
'''
solution = '''
class Duck:
    def speak(self):
        return "quack"


class Robot:
    def speak(self):
        return "beep"


def all_speak(things):
    return [t.speak() for t in things]
'''
[[problem.tests]]
call = "all_speak([Duck(), Robot(), Duck()])"
expect = "['quack', 'beep', 'quack']"
[[problem.tests]]
call = "all_speak([])"
expect = "[]"

[[problem]]
id = "vector_add"
lesson = "poly_ops"
title = "Add two vectors"
level = "Medium"
kind = "function"
story = "Vector(x, y) is given with as_tuple(). Add __add__ so that Vector(1, 2) + Vector(3, 4) gives Vector(4, 6)."
hints = ["a + b calls a.__add__(b).", "Return a new Vector(self.x + other.x, self.y + other.y)."]
approach = "Defining __add__ teaches + what to do with your own objects."
gfg = "python operator overloading"
starter = '''
class Vector:
    def __init__(self, x, y):
        self.x = x
        self.y = y

    def as_tuple(self):
        return (self.x, self.y)
'''
solution = '''
class Vector:
    def __init__(self, x, y):
        self.x = x
        self.y = y

    def as_tuple(self):
        return (self.x, self.y)

    def __add__(self, other):
        return Vector(self.x + other.x, self.y + other.y)
'''
[[problem.tests]]
call = "(Vector(1, 2) + Vector(3, 4)).as_tuple()"
expect = "(4, 6)"
[[problem.tests]]
call = "(Vector(0, 0) + Vector(-1, 5)).as_tuple()"
expect = "(-1, 5)"
