topic = "22"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "recorder_ctx"
lesson = "ctx_protocol"
title = "Write a context manager class"
level = "Medium"
kind = "function"
story = "Write a class Recorder(log) that works with with. Entering the block appends \"start\" to log; leaving it appends \"end\", even if the block raised an error."
hints = ["with calls __enter__ at the start and __exit__ at the end.", "__exit__(self, exc_type, exc, tb) runs even after an error. Return False so the error still shows."]
approach = "__exit__ is guaranteed to run, which is what makes with safe for clean-up."
gfg = "python context manager class"
starter = '''
class Recorder:
    def __init__(self, log):
        self.log = log
'''
solution = '''
class Recorder:
    def __init__(self, log):
        self.log = log

    def __enter__(self):
        self.log.append("start")
        return self

    def __exit__(self, exc_type, exc, tb):
        self.log.append("end")
        return False
'''
[[problem.tests]]
setup = '''
log = []
with Recorder(log):
    log.append("work")
'''
call = "log"
expect = "['start', 'work', 'end']"
[[problem.tests]]
setup = '''
log = []
try:
    with Recorder(log):
        1 / 0
except ZeroDivisionError:
    log.append("caught")
'''
call = "log"
expect = "['start', 'end', 'caught']"

[[problem]]
id = "recording_cm"
lesson = "ctx_contextmanager"
title = "A context manager from a generator"
level = "Medium"
kind = "function"
story = "Write recording(log) as a generator-based context manager: append \"start\", yield, then append \"end\" in a finally block."
hints = ["Code before yield is the setup; code after it is the clean-up.", "This site's Python ignores @contextmanager on generators, so write recording = contextmanager(recording) under the function instead."]
approach = "contextmanager turns the generator into an object with __enter__ (run to the yield) and __exit__ (run the rest)."
gfg = "python contextlib contextmanager"
starter = '''
from contextlib import contextmanager


def recording(log):
    # Write your code here
    pass


recording = contextmanager(recording)
'''
solution = '''
from contextlib import contextmanager


def recording(log):
    log.append("start")
    try:
        yield
    finally:
        log.append("end")


recording = contextmanager(recording)
'''
[[problem.tests]]
setup = '''
log = []
with recording(log):
    log.append("work")
'''
call = "log"
expect = "['start', 'work', 'end']"
