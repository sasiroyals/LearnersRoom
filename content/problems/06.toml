topic = "06"

# Beginner problems: change the program so it prints the right output.
[[problem]]
id = "one_to_five"
title = "Count to five"
level = "Easy"
kind = "output"
story = "Print the numbers 1 to 5, one per line. This program prints 0 to 4."
hint = "range(a, b) starts at a and stops before b."
starter = '''
for i in range(5):
    print(i)
'''
solution = '''
for i in range(1, 6):
    print(i)
'''
[[problem.tests]]
output = '''
1
2
3
4
5
'''

[[problem]]
id = "loop_total"
title = "Add them up"
level = "Easy"
kind = "output"
story = "Print the total of the prices. This program prints 2 instead of 10."
hint = "Each time round, add p to the total so far: total = total + p."
starter = '''
prices = [3, 5, 2]
total = 0
for p in prices:
    total = p
print(total)
'''
solution = '''
prices = [3, 5, 2]
total = 0
for p in prices:
    total = total + p
print(total)
'''
[[problem.tests]]
output = '''
10
'''

[[problem]]
id = "count_down"
title = "Countdown"
level = "Easy"
kind = "output"
story = "Print 3, 2, 1 and then Go! on four lines. This program stops one number too early."
hint = "The loop should keep going while n is above 0."
starter = '''
n = 3
while n > 1:
    print(n)
    n = n - 1
print("Go!")
'''
solution = '''
n = 3
while n > 0:
    print(n)
    n = n - 1
print("Go!")
'''
[[problem.tests]]
output = '''
3
2
1
Go!
'''

[[problem]]
id = "sumevens"
title = "Add up the even numbers"
level = "Easy"
story = "Write sum_evens(nums) that adds only the even numbers in the list."
hint = "Keep a running total that starts at 0, and only add when n % 2 == 0."
starter = '''
def sum_evens(nums):
    pass
'''
solution = '''
def sum_evens(nums):
    total = 0
    for n in nums:
        if n % 2 == 0:
            total = total + n
    return total
'''
demo = '''
print(sum_evens([3, 4, 6, 7]))
'''
[[problem.tests]]
call = "sum_evens([3, 4, 6, 7])"
expect = "10"
[[problem.tests]]
call = "sum_evens([])"
expect = "0"
[[problem.tests]]
call = "sum_evens([1, 3])"
expect = "0"

[[problem]]
id = "countdown"
title = "Countdown list"
level = "Easy"
story = "Write countdown(n) that returns [n, n-1, ..., 1] using a while loop. countdown(0) is []."
hint = "Make sure n gets smaller each time round, or the loop never ends."
starter = '''
def countdown(n):
    pass
'''
solution = '''
def countdown(n):
    result = []
    while n > 0:
        result.append(n)
        n = n - 1
    return result
'''
demo = '''
print(countdown(3))
'''
[[problem.tests]]
call = "countdown(3)"
expect = "[3, 2, 1]"
[[problem.tests]]
call = "countdown(0)"
expect = "[]"

[[problem]]
id = "firstneg"
title = "Position of the first negative"
level = "Medium"
story = "Write first_negative(nums) that returns the index of the first negative number, or -1 if there is none. Stop as soon as you find it."
hint = "Loop over range(len(nums)) so you know the index. return exits the loop at once."
starter = '''
def first_negative(nums):
    pass
'''
solution = '''
def first_negative(nums):
    for i in range(len(nums)):
        if nums[i] < 0:
            return i
    return -1
'''
demo = '''
print(first_negative([4, 0, -3, -8]))
'''
[[problem.tests]]
call = "first_negative([4, 0, -3, -8])"
expect = "2"
[[problem.tests]]
call = "first_negative([1, 2])"
expect = "-1"
[[problem.tests]]
call = "first_negative([-1])"
expect = "0"
