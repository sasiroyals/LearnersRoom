topic = "06"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "letters"
lesson = "loop_for"
title = "One letter per line"
level = "Easy"
kind = "output"
story = "word holds a word. Print each letter on its own line."
hints = ["A for loop over a string gives one letter at a time.", "for ch in word:"]
approach = "for takes each item in turn, and the body runs once per letter."
gfg = "python iterate over string"
starter = '''
# The input is already in: word
# Write your code below and print the answer.
'''
solution = '''
for ch in word:
    print(ch)
'''
[[problem.tests]]
before = '''
word = "cat"
'''
output = '''
c
a
t
'''
[[problem.tests]]
before = '''
word = "a"
'''
output = '''
a
'''
[[problem.tests]]
before = '''
word = "hello"
'''
output = '''
h
e
l
l
o
'''

[[problem]]
id = "list_sum"
lesson = "loop_total"
title = "Sum of a list"
level = "Easy"
kind = "output"
story = "nums is a list of numbers. Print their total without using sum()."
hints = ["Start a total at 0 before the loop.", "Inside the loop: total = total + n."]
approach = "The running total grows by one number each time round the loop."
gfg = "python sum of list elements"
starter = '''
# The input is already in: nums
# Write your code below and print the answer.
'''
solution = '''
total = 0
for n in nums:
    total = total + n
print(total)
'''
[[problem.tests]]
before = '''
nums = [1, 2, 3]
'''
output = '''
6
'''
[[problem.tests]]
before = '''
nums = []
'''
output = '''
0
'''
[[problem.tests]]
before = '''
nums = [10, -4, 6]
'''
output = '''
12
'''

[[problem]]
id = "count_vowels"
lesson = "loop_count"
title = "Count the vowels"
level = "Easy"
kind = "output"
story = "word is a lowercase word. Print how many of its letters are vowels (a, e, i, o, u)."
hints = ["Start a count at 0.", "if ch in \"aeiou\": count = count + 1"]
approach = "The loop checks each letter and adds 1 only when it is a vowel."
gfg = "python count vowels in string"
starter = '''
# The input is already in: word
# Write your code below and print the answer.
'''
solution = '''
count = 0
for ch in word:
    if ch in "aeiou":
        count = count + 1
print(count)
'''
[[problem.tests]]
before = '''
word = "banana"
'''
output = '''
3
'''
[[problem.tests]]
before = '''
word = "sky"
'''
output = '''
0
'''
[[problem.tests]]
before = '''
word = "audio"
'''
output = '''
4
'''

[[problem]]
id = "keep_even"
lesson = "loop_filter"
title = "Keep the even numbers"
level = "Easy"
kind = "output"
story = "nums is a list of whole numbers. Print a new list holding only the even ones, in the same order."
hints = ["Start with an empty list.", "Append n only when n % 2 == 0."]
approach = "The if inside the loop decides which items get appended."
gfg = "python program to print even numbers in a list"
starter = '''
# The input is already in: nums
# Write your code below and print the answer.
'''
solution = '''
evens = []
for n in nums:
    if n % 2 == 0:
        evens.append(n)
print(evens)
'''
[[problem.tests]]
before = '''
nums = [1, 2, 3, 4]
'''
output = '''
[2, 4]
'''
[[problem.tests]]
before = '''
nums = [1, 3]
'''
output = '''
[]
'''
[[problem.tests]]
before = '''
nums = [0, -2, 5]
'''
output = '''
[0, -2]
'''

[[problem]]
id = "digit_count"
lesson = "loop_while"
title = "Count the digits"
level = "Easy"
kind = "output"
story = "n is a whole number of 1 or more. Print how many digits it has, using a while loop (not len or str)."
hints = ["n // 10 drops the last digit.", "Keep dividing while n > 0 and count the steps."]
approach = "Each pass removes one digit, so the number of passes is the number of digits."
gfg = "python count digits in number"
starter = '''
# The input is already in: n
# Write your code below and print the answer.
'''
solution = '''
count = 0
while n > 0:
    n = n // 10
    count = count + 1
print(count)
'''
[[problem.tests]]
before = '''
n = 1234
'''
output = '''
4
'''
[[problem.tests]]
before = '''
n = 7
'''
output = '''
1
'''
[[problem.tests]]
before = '''
n = 100000
'''
output = '''
6
'''

[[problem]]
id = "first_negative"
lesson = "loop_break"
title = "First negative"
level = "Easy"
kind = "output"
story = "nums is a list of numbers. Print the first negative number in it, or none if there is no negative number."
hints = ["Stop the loop with break once you find one.", "A for loop can have an else that runs only if it did not break."]
approach = "break stops at the first match. The loop's else runs only when the loop finished without a break."
gfg = "python break statement"
starter = '''
# The input is already in: nums
# Write your code below and print the answer.
'''
solution = '''
for n in nums:
    if n < 0:
        print(n)
        break
else:
    print("none")
'''
[[problem.tests]]
before = '''
nums = [3, -1, -5]
'''
output = '''
-1
'''
[[problem.tests]]
before = '''
nums = [1, 2]
'''
output = '''
none
'''
[[problem.tests]]
before = '''
nums = [-9]
'''
output = '''
-9
'''
