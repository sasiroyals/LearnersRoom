topic = "18"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "hypotenuse"
lesson = "mod_import"
title = "Use the math module"
level = "Easy"
kind = "function"
story = "Write hypotenuse(a, b) that returns the long side of a right triangle: the square root of a*a + b*b. Use math.sqrt."
hints = ["import math at the top.", "math.sqrt(a * a + b * b)"]
approach = "import loads the module once; then math.sqrt is a normal function call."
gfg = "python math module"
starter = '''
import math

def hypotenuse(a, b):
    # Write your code here
    pass
'''
solution = '''
import math

def hypotenuse(a, b):
    return math.sqrt(a * a + b * b)
'''
[[problem.tests]]
call = "hypotenuse(3, 4)"
expect = "5.0"
[[problem.tests]]
call = "hypotenuse(5, 12)"
expect = "13.0"

[[problem]]
id = "palindrome_main"
lesson = "mod_main"
title = "Keep demo code out of imports"
level = "Easy"
kind = "function"
story = "Write is_palindrome(text) that returns True if text reads the same backwards. Any demo prints should sit under if __name__ == \"__main__\":, so importing the file shows nothing."
hints = ["text[::-1] is the text reversed.", "The demo goes in the if __name__ == \"__main__\": block."]
approach = "__name__ is \"__main__\" only when the file is run directly, so the demo does not run on import."
gfg = "python if name main"
starter = '''
def is_palindrome(text):
    # Write your code here
    pass
'''
solution = '''
def is_palindrome(text):
    return text == text[::-1]


if __name__ == "__main__":
    print(is_palindrome("level"))
'''
[[problem.tests]]
call = "is_palindrome(\"level\")"
expect = "True"
[[problem.tests]]
call = "is_palindrome(\"hello\")"
expect = "False"
[[problem.tests]]
call = "is_palindrome(\"\")"
expect = "True"

[[problem]]
id = "count_lines"
lesson = "mod_files"
title = "Count lines in a file"
level = "Medium"
kind = "function"
story = "Write count_lines(path) that opens the text file at path and returns how many lines it has. Use with so the file is closed."
hints = ["with open(path) as f: opens the file and closes it at the end of the block.", "Count the lines with a loop over f, or len(f.readlines())."]
approach = "with guarantees the file is closed, even if something inside goes wrong."
gfg = "python count lines in file"
starter = '''
def count_lines(path):
    # Write your code here
    pass
'''
solution = '''
def count_lines(path):
    with open(path) as f:
        return len(f.readlines())
'''
[[problem.tests]]
setup = '''
with open("notes.txt", "w") as f:
    f.write("a\nb\nc\n")
'''
call = "count_lines(\"notes.txt\")"
expect = "3"
[[problem.tests]]
setup = '''
with open("empty.txt", "w") as f:
    f.write("")
'''
call = "count_lines(\"empty.txt\")"
expect = "0"
