topic = "24"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "parse_csv_line"
lesson = "des_srp"
title = "One job: parse a line"
level = "Medium"
kind = "function"
story = "Write parse_line(line) that turns a line like \" ann , 30 , paris \" into [\"ann\", \"30\", \"paris\"]. It only parses: no printing, no file reading."
hints = ["line.split(\",\") splits on commas.", "strip() removes spaces at both ends of each part."]
approach = "A function with one job is easy to test and reuse. Reading files and printing belong elsewhere."
gfg = "python split string by comma"
starter = '''
def parse_line(line):
    # Write your code here
    pass
'''
solution = '''
def parse_line(line):
    return [part.strip() for part in line.split(",")]
'''
[[problem.tests]]
call = "parse_line(\" ann , 30 , paris \")"
expect = "['ann', '30', 'paris']"
[[problem.tests]]
call = "parse_line(\"a,b\")"
expect = "['a', 'b']"

[[problem]]
id = "checkout_strategy"
lesson = "des_strategy"
title = "Swap the discount"
level = "Medium"
kind = "function"
story = "Write two discount functions, half_off(price) and ten_off(price) (10 off, never below 0), and checkout(price, discount) that applies whichever discount function it is given."
hints = ["Functions can be passed around like any value.", "checkout just returns discount(price)."]
approach = "checkout does not know which discount it has; you can add new strategies without changing it."
gfg = "python strategy pattern"
starter = '''
def half_off(price):
    pass


def ten_off(price):
    pass


def checkout(price, discount):
    pass
'''
solution = '''
def half_off(price):
    return price / 2


def ten_off(price):
    return max(price - 10, 0)


def checkout(price, discount):
    return discount(price)
'''
[[problem.tests]]
call = "checkout(100, half_off)"
expect = "50.0"
[[problem.tests]]
call = "checkout(100, ten_off)"
expect = "90"
[[problem.tests]]
call = "checkout(4, ten_off)"
expect = "0"

[[problem]]
id = "shape_factory"
lesson = "des_factory"
title = "A shape factory"
level = "Medium"
kind = "function"
story = "Square and Circle are given. Write make_shape(kind, size) that returns a Square for \"square\", a Circle for \"circle\", and raises ValueError for anything else."
hints = ["A dict from names to classes keeps the choice in one place.", "Look the class up, then call it with size."]
approach = "The factory is the one place that decides which class to build; callers only name what they want."
gfg = "python factory method"
starter = '''
class Square:
    def __init__(self, size):
        self.size = size

    def area(self):
        return self.size * self.size


class Circle:
    def __init__(self, size):
        self.size = size

    def area(self):
        return round(3.14159 * self.size * self.size, 2)


def make_shape(kind, size):
    # Write your code here
    pass
'''
solution = '''
class Square:
    def __init__(self, size):
        self.size = size

    def area(self):
        return self.size * self.size


class Circle:
    def __init__(self, size):
        self.size = size

    def area(self):
        return round(3.14159 * self.size * self.size, 2)


SHAPES = {"square": Square, "circle": Circle}


def make_shape(kind, size):
    if kind not in SHAPES:
        raise ValueError(f"unknown shape: {kind}")
    return SHAPES[kind](size)
'''
[[problem.tests]]
call = "make_shape(\"square\", 3).area()"
expect = "9"
[[problem.tests]]
call = "make_shape(\"circle\", 1).area()"
expect = "3.14"
[[problem.tests]]
setup = '''
try:
    make_shape("blob", 1)
    result = "made"
except ValueError:
    result = "refused"
'''
call = "result"
expect = "'refused'"
