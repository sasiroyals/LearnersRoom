def insert(root, value):
    # Write your code here
    pass
'''
solution = '''
class TreeNode:
    def __init__(self, value):
        self.value = value
        self.left = None
        self.right = None


def inorder(node):
    if node is None:
        return []
    return inorder(node.left) + [node.value] + inorder(node.right)


def insert(root, value):
    if root is None:
        return TreeNode(value)
    if value < root.value:
        root.left = insert(root.left, value)
    else:
        root.right = insert(root.right, value)
    return root
'''
[[problem.tests]]
setup = '''
root = None
for v in [5, 2, 8, 1, 9]:
    root = insert(root, v)
'''
call = "inorder(root)"
expect = "[1, 2, 5, 8, 9]"
[[problem.tests]]
setup = '''
root = insert(None, 3)
'''
call = "(root.value, root.left, root.right)"
expect = "(3, None, None)"

[[problem]]
id = "k_smallest"
lesson = "ds_heap"
title = "K smallest numbers"
level = "Medium"
kind = "function"
story = "Write k_smallest(nums, k) that returns the k smallest numbers in increasing order, using the heapq module."
hints = ["heapq.heapify turns a list into a heap in O(n).", "heapq.heappop takes out the smallest item each time."]
approach = "heapify is O(n) and each pop is O(log n), so this is O(n + k log n)."
gfg = "k smallest elements heap"
starter = '''
import heapq


def k_smallest(nums, k):
    # Write your code here
    pass
'''
solution = '''
import heapq


def k_smallest(nums, k):
    heap = list(nums)
    heapq.heapify(heap)
    return [heapq.heappop(heap) for _ in range(min(k, len(heap)))]
'''
[[problem.tests]]
call = "k_smallest([5, 1, 9, 3, 7], 3)"
expect = "[1, 3, 5]"
[[problem.tests]]
call = "k_smallest([4], 2)"
expect = "[4]"
[[problem.tests]]
call = "k_smallest([], 1)"
expect = "[]"
