topic = "27"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "balanced"
lesson = "ds_stack"
title = "Balanced brackets"
level = "Medium"
kind = "function"
story = "Write is_balanced(text) that returns True if every (, [ and { in text is closed by the matching bracket in the right order."
hints = ["Push each opening bracket onto a stack.", "On a closing bracket, the top of the stack must be its partner. At the end the stack must be empty."]
approach = "The last bracket opened must be the first closed, which is exactly what a stack gives you. O(n) time."
gfg = "check for balanced parentheses"
starter = '''
def is_balanced(text):
    # Write your code here
    pass
'''
solution = '''
def is_balanced(text):
    pairs = {")": "(", "]": "[", "}": "{"}
    stack = []
    for ch in text:
        if ch in "([{":
            stack.append(ch)
        elif ch in pairs:
            if not stack or stack.pop() != pairs[ch]:
                return False
    return not stack
'''
[[problem.tests]]
call = "is_balanced(\"([]{})\")"
expect = "True"
[[problem.tests]]
call = "is_balanced(\"([)]\")"
expect = "False"
[[problem.tests]]
call = "is_balanced(\"((\")"
expect = "False"
[[problem.tests]]
call = "is_balanced(\"\")"
expect = "True"

