solution = '''
class Node:
    def __init__(self, value, next=None):
        self.value = value
        self.next = next


def build(values):
    head = None
    for v in reversed(values):
        head = Node(v, head)
    return head


def to_list(head):
    out = []
    while head is not None:
        out.append(head.value)
        head = head.next
    return out


def reverse(head):
    prev = None
    while head is not None:
        nxt = head.next
        head.next = prev
        prev = head
        head = nxt
    return prev
'''
[[problem.tests]]
call = "to_list(reverse(build([1, 2, 3])))"
expect = "[3, 2, 1]"
[[problem.tests]]
call = "to_list(reverse(build([])))"
expect = "[]"
[[problem.tests]]
call = "to_list(reverse(build([7])))"
expect = "[7]"

