topic = "20"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "first_n"
lesson = "gen_iter"
title = "Take the first n"
level = "Medium"
kind = "function"
story = "Write first_n(iterable, n) that returns a list of the first n items, using iter() and next(). If there are fewer than n items, return all of them."
hints = ["it = iter(iterable), then next(it) gives one item at a time.", "next raises StopIteration when it runs out: catch it and stop."]
approach = "This is what a for loop does for you: call next until StopIteration."
gfg = "python iter and next"
starter = '''
def first_n(iterable, n):
    # Write your code here
    pass
'''
solution = '''
def first_n(iterable, n):
    it = iter(iterable)
    out = []
    for _ in range(n):
        try:
            out.append(next(it))
        except StopIteration:
            break
    return out
'''
[[problem.tests]]
call = "first_n(\"hello\", 3)"
expect = "['h', 'e', 'l']"
[[problem.tests]]
call = "first_n([1, 2], 5)"
expect = "[1, 2]"
[[problem.tests]]
call = "first_n(range(100), 0)"
expect = "[]"

[[problem]]
id = "countdown_gen"
lesson = "gen_yield"
title = "Countdown generator"
level = "Easy"
kind = "function"
story = "Write a generator countdown(n) that yields n, n - 1, ..., 1."
hints = ["Use yield inside a loop instead of building a list.", "while n > 0: yield n; n -= 1"]
approach = "Each yield pauses the function and hands out one value; the next request resumes it."
gfg = "python generators"
starter = '''
def countdown(n):
    # Write your code here
    pass
'''
solution = '''
def countdown(n):
    while n > 0:
        yield n
        n -= 1
'''
[[problem.tests]]
call = "list(countdown(3))"
expect = "[3, 2, 1]"
[[problem.tests]]
call = "list(countdown(0))"
expect = "[]"

[[problem]]
id = "stats_once"
lesson = "gen_usedup"
title = "Use an iterator once"
level = "Medium"
kind = "function"
story = "Write stats(numbers) that returns (total, count). numbers may be a generator, which can only be read once. The current version reads it twice and gets the count wrong."
hints = ["After sum() reads a generator, it is empty.", "Turn it into a list first: nums = list(numbers)."]
approach = "A list can be read as often as you like; a generator is used up after one pass."
gfg = "python generator exhausted"
starter = '''
def stats(numbers):
    return (sum(numbers), len(list(numbers)))
'''
solution = '''
def stats(numbers):
    nums = list(numbers)
    return (sum(nums), len(nums))
'''
[[problem.tests]]
call = "stats(x for x in [1, 2, 3])"
expect = "(6, 3)"
[[problem.tests]]
call = "stats([4, 5])"
expect = "(9, 2)"
[[problem.tests]]
call = "stats(iter([]))"
expect = "(0, 0)"

[[problem]]
id = "even_squares"
lesson = "gen_pipeline"
title = "A generator pipeline"
level = "Medium"
kind = "function"
story = "Write even_squares(nums), a generator that yields the square of each even number, using two small generator steps chained together."
hints = ["evens = (n for n in nums if n % 2 == 0)", "Then yield from (n * n for n in evens), or loop and yield."]
approach = "Each step pulls one value at a time from the step before, so nothing builds a full list in between."
gfg = "python generator pipeline"
starter = '''
def even_squares(nums):
    # Write your code here
    pass
'''
solution = '''
def even_squares(nums):
    evens = (n for n in nums if n % 2 == 0)
    for n in evens:
        yield n * n
'''
[[problem.tests]]
call = "list(even_squares([1, 2, 3, 4]))"
expect = "[4, 16]"
[[problem.tests]]
call = "list(even_squares([]))"
expect = "[]"
[[problem.tests]]
call = "list(even_squares([5, 7]))"
expect = "[]"
