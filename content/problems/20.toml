topic = "20"

[[problem]]
id = "countgen"
title = "A countdown generator"
level = "Easy"
story = "Write a generator countdown(n) that yields n, n-1, ..., 1."
hint = "yield hands back one value and pauses. The loop picks up where it left off."
starter = '''
def countdown(n):
    pass
'''
solution = '''
def countdown(n):
    while n > 0:
        yield n
        n = n - 1
'''
demo = '''
for x in countdown(3):
    print(x)
'''
[[problem.tests]]
call = "list(countdown(3))"
expect = "[3, 2, 1]"
[[problem.tests]]
call = "list(countdown(0))"
expect = "[]"

[[problem]]
id = "evens"
title = "Filter with a generator"
level = "Easy"
story = "Write a generator evens(nums) that yields only the even numbers, one at a time."
hint = "Use yield inside the if, instead of building a list."
starter = '''
def evens(nums):
    pass
'''
solution = '''
def evens(nums):
    for n in nums:
        if n % 2 == 0:
            yield n
'''
demo = '''
print(list(evens([1, 2, 3, 4])))
'''
[[problem.tests]]
call = "list(evens([1, 2, 3, 4]))"
expect = "[2, 4]"
[[problem.tests]]
call = "list(evens([]))"
expect = "[]"

[[problem]]
id = "take"
title = "Take the first few"
level = "Medium"
story = "Write take(n, items) that uses iter() and next() to return the first n items as a list. Assume there are at least n."
hint = "iter(items) gives an iterator. Each next(it) moves it forward by one."
starter = '''
def take(n, items):
    pass
'''
solution = '''
def take(n, items):
    it = iter(items)
    result = []
    for _ in range(n):
        result.append(next(it))
    return result
'''
demo = '''
print(take(2, 'abc'))
'''
[[problem.tests]]
call = "take(2, 'abc')"
expect = "['a', 'b']"
[[problem.tests]]
call = "take(0, [1])"
expect = "[]"
[[problem.tests]]
call = "take(3, [9, 8, 7, 6])"
expect = "[9, 8, 7]"
