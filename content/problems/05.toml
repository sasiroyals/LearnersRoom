topic = "05"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "second_last"
lesson = "index"
title = "Second to last"
level = "Easy"
kind = "output"
story = "items is a list with at least 2 things in it. Print the second to last item."
hints = ["Negative indexes count from the end.", "-1 is the last item, so the one before it is -2."]
approach = "items[-2] counts two places back from the end, whatever the length."
gfg = "python list negative indexing"
starter = '''
# The input is already in: items
# Write your code below and print the answer.
'''
solution = '''
print(items[-2])
'''
[[problem.tests]]
before = '''
items = ["a", "b", "c"]
'''
output = '''
b
'''
[[problem.tests]]
before = '''
items = [10, 20]
'''
output = '''
10
'''
[[problem.tests]]
before = '''
items = ["x", "y", "z", "w"]
'''
output = '''
z
'''

[[problem]]
id = "first_three"
lesson = "slice"
title = "First three"
level = "Easy"
kind = "output"
story = "nums is a list. Print a list of its first three items (or all of them if it has fewer)."
hints = ["A slice stops before its end index.", "nums[:3] takes indexes 0, 1 and 2."]
approach = "Slicing never fails for being too long: nums[:3] on a 2-item list just gives both."
gfg = "python list slicing"
starter = '''
# The input is already in: nums
# Write your code below and print the answer.
'''
solution = '''
print(nums[:3])
'''
[[problem.tests]]
before = '''
nums = [5, 6, 7, 8, 9]
'''
output = '''
[5, 6, 7]
'''
[[problem.tests]]
before = '''
nums = [1, 2]
'''
output = '''
[1, 2]
'''
[[problem.tests]]
before = '''
nums = []
'''
output = '''
[]
'''

[[problem]]
id = "both_ends"
lesson = "append"
title = "Add to both ends"
level = "Easy"
kind = "output"
story = "nums is a list and x is a number. Put x at the start of the list and also at the end, then print the list."
hints = ["append adds to the end.", "insert(0, x) puts x at the front."]
approach = "insert takes a position; append always goes to the end."
gfg = "python list insert append"
starter = '''
# The input is already in: nums, x
# Write your code below and print the answer.
'''
solution = '''
nums.insert(0, x)
nums.append(x)
print(nums)
'''
[[problem.tests]]
before = '''
nums = [1, 2, 3]
x = 0
'''
output = '''
[0, 1, 2, 3, 0]
'''
[[problem.tests]]
before = '''
nums = []
x = 5
'''
output = '''
[5, 5]
'''
[[problem.tests]]
before = '''
nums = ["b"]
x = "a"
'''
output = '''
['a', 'b', 'a']
'''

[[problem]]
id = "on_the_list"
lesson = "member"
title = "On the guest list?"
level = "Easy"
kind = "output"
story = "guests is a list of names and name is a name. Print True if name is on the list, otherwise False."
hints = ["in checks the items in a list.", "print(name in guests)"]
approach = "name in guests is already True or False, so you can print it directly."
gfg = "python check if element exists in list"
starter = '''
# The input is already in: guests, name
# Write your code below and print the answer.
'''
solution = '''
print(name in guests)
'''
[[problem.tests]]
before = '''
guests = ["Ana", "Ben"]
name = "Ben"
'''
output = '''
True
'''
[[problem.tests]]
before = '''
guests = ["Ana", "Ben"]
name = "Cy"
'''
output = '''
False
'''
[[problem.tests]]
before = '''
guests = []
name = "Ana"
'''
output = '''
False
'''

[[problem]]
id = "safe_index"
lesson = "range"
title = "Safe index"
level = "Easy"
kind = "output"
story = "items is a list and i is a whole number of 0 or more. Print items[i] if that position exists, otherwise print out of range."
hints = ["A list of 3 items has indexes 0, 1 and 2.", "Check i < len(items) before you use it."]
approach = "The last valid index is len(items) - 1, so i must be smaller than len(items)."
gfg = "python list index out of range"
starter = '''
print(items[i])
'''
solution = '''
if i < len(items):
    print(items[i])
else:
    print("out of range")
'''
[[problem.tests]]
before = '''
items = ["a", "b", "c"]
i = 2
'''
output = '''
c
'''
[[problem.tests]]
before = '''
items = ["a", "b", "c"]
i = 3
'''
output = '''
out of range
'''
[[problem.tests]]
before = '''
items = []
i = 0
'''
output = '''
out of range
'''

[[problem]]
id = "copy_first"
lesson = "alias"
title = "Change a copy"
level = "Easy"
kind = "output"
story = "nums is a list. Make a second list that is nums with 0 added to the end, but leave nums unchanged. Print nums, then the new list."
hints = ["extra = nums does not copy: both names point at one list.", "nums.copy() or nums[:] makes a real copy."]
approach = "copy() makes a new list, so appending to it leaves the original alone."
gfg = "python list copy"
starter = '''
extra = nums
extra.append(0)
print(nums)
print(extra)
'''
solution = '''
extra = nums.copy()
extra.append(0)
print(nums)
print(extra)
'''
[[problem.tests]]
before = '''
nums = [1, 2]
'''
output = '''
[1, 2]
[1, 2, 0]
'''
[[problem.tests]]
before = '''
nums = []
'''
output = '''
[]
[0]
'''
[[problem.tests]]
before = '''
nums = [5]
'''
output = '''
[5]
[5, 0]
'''
