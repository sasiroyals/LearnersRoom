topic = "29"
# One problem per lesson sub-topic. Generated test answers come from the solution.

[[problem]]
id = "make_grid"
lesson = "got_grid"
title = "Independent rows"
level = "Medium"
kind = "function"
story = "make_grid(rows, cols) should return a grid of zeros where every row is its own list. Right now changing one cell changes every row. Fix it."
hints = ["[[0] * cols] * rows repeats one row object.", "Make a new row each time: [[0] * cols for _ in range(rows)]."]
approach = "The comprehension runs [0] * cols once per row, giving separate lists."
gfg = "python create 2d list"
starter = '''
def make_grid(rows, cols):
    return [[0] * cols] * rows
'''
solution = '''
def make_grid(rows, cols):
    return [[0] * cols for _ in range(rows)]
'''
[[problem.tests]]
setup = '''
g = make_grid(2, 3)
g[0][0] = 1
'''
call = "g"
expect = "[[1, 0, 0], [0, 0, 0]]"
[[problem.tests]]
setup = '''
g = make_grid(0, 3)
'''
call = "g"
expect = "[]"

[[problem]]
id = "make_adders"
lesson = "got_lambda_loop"
title = "Adders that remember"
level = "Hard"
kind = "function"
story = "make_adders(n) should return n functions where the i-th one adds i to its argument. Right now every function adds n - 1. Fix it."
hints = ["A lambda looks i up when it is called, after the loop has finished.", "Freeze the current value with a default: lambda x, i=i: x + i."]
approach = "Default values are worked out when the lambda is made, so each one keeps its own i."
gfg = "python lambda in loop"
starter = '''
def make_adders(n):
    return [lambda x: x + i for i in range(n)]
'''
solution = '''
def make_adders(n):
    return [lambda x, i=i: x + i for i in range(n)]
'''
[[problem.tests]]
call = "[f(10) for f in make_adders(3)]"
expect = "[10, 11, 12]"
[[problem.tests]]
call = "len(make_adders(0))"
expect = "0"

[[problem]]
id = "remove_evens"
lesson = "got_remove_loop"
title = "Remove while looping"
level = "Medium"
kind = "function"
story = "remove_evens(nums) should remove every even number from the list, changing it in place. Right now it skips some. Fix it."
hints = ["Removing an item shifts the rest left, so the loop skips the next one.", "Build the kept items first, then nums[:] = kept."]
approach = "Never change a list's length while looping over it. Replace its contents in one step instead."
gfg = "python remove items from list while iterating"
starter = '''
def remove_evens(nums):
    for n in nums:
        if n % 2 == 0:
            nums.remove(n)
'''
solution = '''
def remove_evens(nums):
    nums[:] = [n for n in nums if n % 2 != 0]
'''
[[problem.tests]]
setup = '''
a = [2, 4, 6, 1]
remove_evens(a)
'''
call = "a"
expect = "[1]"
[[problem.tests]]
setup = '''
a = [1, 2, 3, 4]
remove_evens(a)
'''
call = "a"
expect = "[1, 3]"
[[problem.tests]]
setup = '''
a = []
remove_evens(a)
'''
call = "a"
expect = "[]"

[[problem]]
id = "display_name"
lesson = "got_and_or"
title = "Default name with or"
level = "Easy"
kind = "function"
story = "display_name(name) should return the name, or \"Guest\" when the name is empty. The current version uses and, which gives the wrong value. Fix it."
hints = ["and returns the first falsy value, or the last value.", "or returns the first truthy value: name or \"Guest\"."]
approach = "An empty string is falsy, so or moves on to \"Guest\"; a real name is truthy and is returned as it is."
gfg = "python and or operators"
starter = '''
def display_name(name):
    return name and "Guest"
'''
solution = '''
def display_name(name):
    return name or "Guest"
'''
[[problem.tests]]
call = "display_name(\"Ann\")"
expect = "'Ann'"
[[problem.tests]]
call = "display_name(\"\")"
expect = "'Guest'"
